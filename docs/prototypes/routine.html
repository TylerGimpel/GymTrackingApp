<title>Routine Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<!--
  THROWAWAY PROTOTYPE - not production code. Wayfinder ticket #136
  "Prototype: building and editing a routine" (map #130 "Map: UI overhaul").

  Question: how should viewing, building and editing a routine look, including
  choosing equipment and replacing or adding exercises?

  Shared by every variant:
    - Sample data: a Push / Pull / Legs routine with plain names (common-routines research).
      Pull is next up; Squat and Barbell row are kept. The panel can load an empty routine instead.
    - Exercises show an equipment icon and a plain name. The exercise sheet and the picker
      show a muscle diagram. Icons and the body are rough stand-ins for Tabler and MuscleMap.
    - "Replace" changes an exercise for good. (Swap is the session-only word.)
    - "Keep" is the pin: it stays put when the routine is built again.
    - Routine settings reuse setup's summary rows and tile pages. Changing the goal, rep style,
      equipment or split offers to build again; the answer is always the lifter's.
    - Adding, removing or moving a day restarts the cycle at day 1, and says so.
    - "Build it again" really reshuffles the unkept exercises here, with Undo.
    - Back is real browser history, so the phone's Back steps back.

  Three variants disagree about the structure:
    A  Drill down - day cards on the Routine tab; tap one for its own page. Tap an exercise for
                    a sheet with the diagram and Replace / Keep / Remove. Settings behind a gear.
    B  Day tabs   - Days · Muscles · Setup tabs. Day chips across the top; every exercise row has
                    its own Keep, Replace and Remove buttons. Days are edited on their own page.
    C  Edit mode  - (CHOSEN, with D's time margin and wording) a clean read-only page: muscles, then every day and its lifts, then settings.
                    One Edit button turns on every control at once; Done turns them off.

    D  Boxes + days - (round 2, from the lifter's pick) C's top (name, then the muscle diagram),
                    A's day boxes with Next up. A box opens that day laid out like C's, with its own
                    Edit. Findings say what they are instead of "N things to look at", and a day
                    only reads as too long past 10% over the session length.

  Switch with the floating panel (top right) or the arrow keys.
-->
<style>
  :root {
    color-scheme: dark;
    --bg:#14130F; --surface:#1E1C17; --s2:#2A2720; --line:#3E392E; --text:#F5F2EA; --dim:#ABA590;
    --accent:#F5C518; --on:#1A1600; --at:#F5C518; --good:#6FCF7F; --warn:#FFB38A; --scrim:rgba(0,0,0,.55);
    --m2:rgba(245,197,24,.4);
    --disp:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --r:6px; --rbig:10px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: light;
      --bg:#F6F4EE; --surface:#FFFFFF; --s2:#ECE8DD; --line:#D6CFBC; --text:#1A1813; --dim:#696350;
      --accent:#EDB800; --on:#1A1600; --at:#1A1813; --good:#2E8B3E; --warn:#A6461A; --scrim:rgba(20,18,12,.45); --m2:rgba(237,184,0,.45); }
  }
  :root[data-theme="light"] { color-scheme: light;
    --bg:#F6F4EE; --surface:#FFFFFF; --s2:#ECE8DD; --line:#D6CFBC; --text:#1A1813; --dim:#696350;
    --accent:#EDB800; --on:#1A1600; --at:#1A1813; --good:#2E8B3E; --warn:#A6461A; --scrim:rgba(20,18,12,.45); --m2:rgba(237,184,0,.45); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 var(--body); -webkit-user-select: none; user-select: none; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); height: 56px; padding: 0 14px; width: 100%; -webkit-user-select: text; user-select: text; }
  #app { max-width: 440px; margin-inline: auto; height: 100%; display: flex; flex-direction: column; position: relative; }
  .dim { color: var(--dim); }
  .label { font: 600 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; border-radius: var(--r);
         font: 700 22px/1 var(--disp); letter-spacing: .03em; text-transform: uppercase; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--on); }
  .btn.big { min-height: 72px; font-size: 28px; }
  .btn.ghost { background: var(--s2); }
  .btn.quiet { min-height: 52px; font-size: 19px; color: var(--dim); }
  .btn.dashed { border: 2px dashed var(--line); color: var(--dim); min-height: 60px; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .foot { flex: none; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); background: var(--bg); }
  .q { margin: 8px 0; font: 700 40px/1 var(--disp); text-transform: uppercase; text-wrap: balance; }
  .ico { width: 28px; height: 28px; flex: none; }
  .note { font-size: 15px; color: var(--warn); }
  .sect { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .banner { padding: 12px 14px; border-radius: var(--r); background: var(--s2); border-left: 4px solid var(--accent); font-size: 15px; }

  .topbar { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 4px; flex: none; }
  .topbar h1 { margin: 0; font: 700 28px/1 var(--disp); text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; padding-left: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .back + h1 { padding-left: 0; }
  .ib { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r); flex: none; }
  .tb { height: 44px; padding: 0 14px; border-radius: var(--r); font: 700 18px/1 var(--disp); letter-spacing: .05em; text-transform: uppercase; }
  .tb.on { background: var(--accent); color: var(--on); }

  nav.bn { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); flex: none; }
  nav.bn button { min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--dim); }
  nav.bn svg { width: 26px; height: 26px; }
  nav.bn button[aria-current="page"] { color: var(--text); box-shadow: inset 0 3px 0 var(--accent); }
  nav.bn button[aria-current="page"] svg { color: var(--at); }

  /* routine head */
  .rhead { display: flex; flex-direction: column; gap: 4px; }
  .rhead .nm { font: 700 34px/1 var(--disp); text-transform: uppercase; }
  .rhead .meta { font-size: 15px; color: var(--dim); }

  /* A: day cards */
  .day { padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
  .day .top { display: flex; align-items: baseline; gap: 10px; }
  .day .pos { font: 700 20px/1 var(--disp); color: var(--dim); width: 18px; }
  .day .dn { font: 700 32px/1 var(--disp); text-transform: uppercase; flex: 1; }
  .day .lifts { font-size: 15px; color: var(--dim); line-height: 1.5; }
  .day.next { border: 2px solid var(--accent); padding: 15px; }
  .tag { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--on); background: var(--accent); padding: 4px 6px; border-radius: 4px; }
  .tag.plain { background: var(--s2); color: var(--dim); }
  .meta2 { font-size: 15px; color: var(--dim); display: flex; gap: 14px; }
  .meta2 b { color: var(--text); font-weight: 600; }
  .meta2 .over { color: var(--warn); }

  /* exercise rows */
  .ex { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 8px 12px 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); width: 100%; text-align: left; }
  .ex .eqi { width: 44px; height: 44px; border-radius: var(--r); background: var(--s2); display: grid; place-items: center; flex: none; color: var(--dim); }
  .ex .eqi .ico { width: 28px; height: 28px; }
  .ex .t { flex: 1; min-width: 0; }
  .ex .t b { display: block; font: 700 22px/1.05 var(--disp); text-transform: uppercase; }
  .ex .t small { display: block; font-size: 14px; color: var(--dim); margin-top: 3px; }
  .ex .sets { font: 700 22px/1 var(--disp); white-space: nowrap; }
  .ex .sets small { font: 500 13px/1 var(--body); color: var(--dim); margin-left: 2px; }
  .kept { color: var(--at); display: inline-flex; vertical-align: -3px; margin-left: 4px; }
  .rowbtns { display: flex; gap: 4px; flex: none; }
  .rowbtns button { width: 44px; height: 44px; border-radius: var(--r); background: var(--s2); display: grid; place-items: center; color: var(--dim); }
  .rowbtns button.on { background: var(--accent); color: var(--on); }
  .rowbtns .ico { width: 22px; height: 22px; }

  /* B: tabs + chips */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin: 0 16px 8px; flex: none; }
  .seg button { height: 44px; border-radius: 4px; font: 700 18px/1 var(--disp); letter-spacing: .05em; text-transform: uppercase; color: var(--dim); text-align: center; }
  .seg button.on { background: var(--s2); color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); }
  .dchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; padding: 2px 0; }
  .dchips::-webkit-scrollbar { display: none; }
  .dchip { flex: none; min-width: 72px; height: 56px; padding: 0 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font: 700 22px/1 var(--disp); text-transform: uppercase; position: relative; }
  .dchip.on { background: var(--accent); color: var(--on); border-color: var(--accent); }
  .dchip .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

  /* C: view / edit */
  .vday { display: flex; flex-direction: column; gap: 6px; padding: 16px 0; border-top: 1px solid var(--line); }
  .vday .top { display: flex; align-items: center; gap: 10px; }
  .vday .dn { font: 700 30px/1 var(--disp); text-transform: uppercase; flex: 1; min-width: 0; }
  .vex { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .vex .ico { width: 24px; height: 24px; color: var(--dim); }
  .vex b { flex: 1; font-weight: 500; font-size: 18px; }
  .vex .sets { font: 700 20px/1 var(--disp); color: var(--dim); }
  .editing .vex { min-height: 60px; }
  .dname { font: 700 26px/1 var(--disp); text-transform: uppercase; height: 52px; flex: 1; min-width: 0; }

  /* muscles */
  .bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bodies svg { width: 100%; height: auto; max-height: 260px; }
  .bodies.small svg { max-height: 150px; }
  .mrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mrow b { font: 700 22px/1 var(--disp); text-transform: uppercase; }
  .mrow span { font-size: 15px; color: var(--dim); text-align: right; }
  .mbar { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: var(--s2); position: relative; overflow: hidden; }
  .mbar .band { position: absolute; top: 0; bottom: 0; background: var(--line); }
  .mbar .fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 2px; background: var(--accent); }
  .finding { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .finding p { margin: 0; }
  .finding small { color: var(--dim); font-size: 15px; }

  /* settings rows (setup's summary) */
  .rowlist { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); overflow: hidden; }
  .srow { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 10px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .srow:first-child { border-top: 0; }
  .srow .t { flex: 1; min-width: 0; }
  .srow .t .label { display: block; margin-bottom: 6px; }
  .srow .t b { display: block; font: 700 24px/1.05 var(--disp); text-transform: uppercase; }
  .srow .ico { color: var(--dim); }

  /* setup-style tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tiles.three { grid-template-columns: repeat(3, 1fr); }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 130px; padding: 14px 8px;
          background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); text-align: center; }
  .tile .ico { width: 44px; height: 44px; color: var(--dim); }
  .tile b { font: 700 22px/1 var(--disp); text-transform: uppercase; }
  .tile small { font-size: 14px; color: var(--dim); }
  .tile.wide { grid-column: 1 / -1; min-height: 90px; flex-direction: row; gap: 16px; }
  .tile.on { border: 2px solid var(--accent); background: var(--s2); }
  .tile.on .ico { color: var(--at); }
  .tile .ck { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on); display: none; place-items: center; }
  .tile.on .ck { display: grid; }
  .tile.num2 { min-height: 84px; } .tile.num2 b { font-size: 44px; }
  .tiles.eqt .tile { min-height: 110px; gap: 8px; } .tiles.eqt .tile b { font-size: 17px; }
  .split { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); width: 100%; text-align: left; }
  .split b { font: 700 24px/1 var(--disp); text-transform: uppercase; }
  .split.on { border: 2px solid var(--accent); padding: 13px 15px; background: var(--s2); }
  .blocks { display: flex; gap: 4px; }
  .blocks i { flex: 1; height: 36px; border-radius: 4px; background: var(--s2); display: grid; place-items: center; font: 700 14px/1 var(--disp); font-style: normal; text-transform: uppercase; overflow: hidden; }
  .split.on .blocks i { background: var(--bg); }

  /* picker */
  .fchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .fchips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--s2); font-weight: 600; font-size: 15px; }
  .fchip.on { background: var(--accent); color: var(--on); }
  .ex.off { opacity: .5; }

  /* sheets */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 440px; max-height: 88%; overflow-y: auto; z-index: 21;
           background: var(--surface); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; margin-bottom: 4px; }
  .sheet h3 { margin: 0; font: 700 32px/1 var(--disp); text-transform: uppercase; text-wrap: balance; }
  .act { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 14px; border-radius: var(--r); background: var(--s2); font: 700 20px/1 var(--disp); letter-spacing: .03em; text-transform: uppercase; width: 100%; }
  .act.on { background: var(--accent); color: var(--on); }
  .act.danger { color: var(--warn); }
  .act .ico { width: 24px; height: 24px; }
  .act small { margin-left: auto; font: 500 14px/1 var(--body); text-transform: none; letter-spacing: 0; opacity: .8; }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 14px; background: var(--text); color: var(--bg);
           padding: 0 8px 0 16px; min-height: 52px; border-radius: var(--r); font-weight: 600; font-size: 15px; width: calc(100% - 32px); max-width: 408px; }
  #toast[hidden] { display: none; }
  #toast button { margin-left: auto; height: 40px; padding: 0 12px; font: 700 18px/1 var(--disp); text-transform: uppercase; color: var(--accent); }
  :root[data-theme="light"] #toast button { color: #8A6A00; }

  .proto { position: fixed; z-index: 99; top: calc(env(safe-area-inset-top, 0px) + 60px); right: 6px; display: flex; flex-direction: column; gap: 2px;
           background: #0a0a0a; color: #fff; border: 1px dashed #ff3bd4; border-radius: 12px; padding: 4px; font: 600 12px/1.2 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .proto button { color: #fff; padding: 7px 8px; border-radius: 8px; text-align: left; }
  .proto button.on { background: #ff3bd4; color: #000; }
  .proto .hr { height: 1px; background: #333; margin: 2px 0; }
  .proto.min > :not(.tog) { display: none; }
</style>

<div id="app"></div>
<div id="layers"></div>
<div id="toast" hidden></div>
<div class="proto" id="proto"></div>

<script>
const NAMES = { A:"Drill down", B:"Day tabs", C:"Edit mode", D:"Boxes + days" };
const P = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const svg = (d, st="") => `<svg class="ico" ${st?`style="${st}"`:""} viewBox="0 0 24 24" ${P}>${d}</svg>`;
// Rough stand-ins on Tabler's grid (24x24, 2px round stroke).
const IC = {
  back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>', check:'<path d="M5 12l5 5 9-10"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  pin:'<path d="M15 4.5l-4 4-4 1.5-1.5 1.5 7 7 1.5-1.5 1.5-4 4-4M9 15l-4.5 4.5M14.5 4l5.5 5.5"/>',
  swap:'<path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', up:'<path d="M12 19V5M6 11l6-6 6 6"/>', down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  refresh:'<path d="M20 11A8 8 0 0 0 5.3 7M4 4v4h4M4 13a8 8 0 0 0 14.7 4M20 20v-4h-4"/>',
  today:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  routine:'<path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/>',
  more:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  barbell:'<path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/>',
  dumbbell:'<rect x="4" y="8" width="4" height="8" rx="1"/><rect x="16" y="8" width="4" height="8" rx="1"/><path d="M8 12h8M2 11v2M22 11v2"/>',
  ezbar:'<path d="M2 12h3l2-2 2.5 4 2.5-4 2.5 4 2.5-4 2 2h3M5 8v8M19 8v8"/>',
  cable:'<path d="M4 3v18M4 3h9"/><circle cx="13" cy="5" r="2"/><path d="M15 5v10M12 18h6M15 15v3"/>',
  machine:'<path d="M5 3v18M19 3v18M5 3h14M12 3v7"/><rect x="8" y="10" width="8" height="3"/><rect x="8" y="14" width="8" height="3"/><rect x="8" y="18" width="8" height="3"/>',
  kettle:'<circle cx="12" cy="15" r="6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
  bands:'<path d="M5 6c4 3 10 3 14 0M5 18c4-3 10-3 14 0M5 6c-2 4-2 8 0 12M19 6c2 4 2 8 0 12"/>',
  medball:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3 3.5 15 0 18M12 3c-3.5 3-3.5 15 0 18"/>',
  swissball:'<circle cx="12" cy="11" r="8"/><path d="M7 5.5c3 3 3 8 0 11.5M8 21h8"/>',
  foam:'<ellipse cx="6" cy="12" rx="2.5" ry="5"/><path d="M6 7h12a2.5 5 0 0 1 0 10H6M11 7v10M15 7v10"/>',
  body:'<circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10l5-1 5 1M12 14l-3 7M12 14l3 7"/>',

// muscle load: direct sets count 1, indirect count a half, per cycle, turned into per week through the cadence
function load() {
  const m = {};
  const per = R().days / liftingDays();
  R().rot.forEach(d => { const hit = new Set(); d.ex.forEach(e => { const b = BY[e.id];
    b.p.forEach(x => { (m[x] ??= { direct:0, sets:0, days:new Set() }); m[x].sets += e.sets; m[x].direct += e.sets; m[x].days.add(d.id); });
    b.s.forEach(x => { (m[x] ??= { direct:0, sets:0, days:new Set() }); m[x].sets += e.sets / 2; }); }); });
  return MAIN.map(x => ({ muscle:x, week: (m[x]?.sets ?? 0) * per, direct: (m[x]?.direct ?? 0), days: m[x]?.days.size ?? 0 }));
}
function findings() {
  const out = [];
  R().rot.forEach(d => { const m = minutesOf(d); if ("CD".includes(S.v) ? overTime(d) : (!d.cardio && m > R().minutes)) out.push({ kind:"long", day:d.name, m, said:`${d.name} runs about ${m} minutes, past the ${R().minutes} you have.`, relax:["Take a set off something", "Allow longer sessions"] }); });
  load().forEach(l => { if (l.direct === 0) out.push({ kind:"nolift", muscle:l.muscle, week:l.week, said: l.week ? `Nothing here is for ${l.muscle}. It gets ${fmt(l.week)} sets a week from other lifts.` : `Nothing in this cycle trains ${l.muscle}.`, relax:[`Add a ${l.muscle} lift to a day`] }); });
  return out;
}

let hist = true;
function push(e) { S.stack.push(e); try { history.pushState({ d:S.stack.length }, ""); } catch (x) { hist = false; } render(); }
function swapTop(e) { S.stack[S.stack.length - 1] = e; try { history.replaceState({ d:S.stack.length }, ""); } catch (x) {} render(); }
function back() { if (S.stack.length <= 1) return; if (hist) history.back(); else { S.stack.pop(); render(); } }
function backN(n) { n = Math.min(n, S.stack.length - 1); if (n <= 0) return; if (hist) history.go(-n); else { S.stack.length -= n; render(); } }

// ---------------------------------------------------------------- the picker (add or replace)
function picker(mode, did, k) {
  const d = dayOf(did), cur = k ? d.ex.find(x => x.k === +k) : null, curB = cur && BY[cur.id];
  const inDay = new Set(d.ex.map(e => e.id)), q = S.q.trim().toLowerCase();
  const have = e => e.eq === "body only" || R().equip.has(e.eq);
  let list = BANK.filter(e => !inDay.has(e.id) && (!q || e.name.toLowerCase().includes(q) || e.p.some(m => m.includes(q))));
  if (S.pickFilter === "gym") list = list.filter(have);
  const rank = e => curB ? (e.p[0] === curB.p[0] ? 0 : e.p.some(m => curB.p.includes(m)) ? 1 : 2) : 0;
  list.sort((a, b) => rank(a) - rank(b));
  const same = curB ? list.filter(e => rank(e) === 0) : [], rest = curB ? list.filter(e => rank(e) !== 0) : list;
  const row = e => `<button class="ex ${have(e)?"":"off"}" data-picked="${e.id}"><span class="eqi">${eqIcon(e.eq)}</span><span class="t"><b>${e.name}</b><small>${e.p.join(", ")}${have(e)?"":" · not at your gym"}</small></span></button>`;
  return bar(curB ? `Replace ${curB.name}` : `Add to ${d.name}`) + `<div class="scroll">
    <div style="position:relative"><input id="q" type="search" placeholder="Search" value="${S.q.replace(/"/g,"&quot;")}" autocomplete="off" style="padding-left:44px"><span style="position:absolute;left:12px;top:16px;color:var(--dim)">${svg(IC.search,"width:22px;height:22px")}</span></div>
    <div class="fchips"><button class="fchip ${S.pickFilter==="gym"?"on":""}" data-filter="gym">My gym</button><button class="fchip ${S.pickFilter==="all"?"on":""}" data-filter="all">Everything</button></div>
    ${same.length ? `<div class="label sect">Same muscle</div>${same.map(row).join("")}<div class="label sect">Others</div>` : ""}
    ${rest.map(row).join("") || `<div class="dim">Nothing matches.</div>`}
    <button class="btn quiet" data-toast="Add new: the exercise form">+ Add a new exercise</button>
  </div>`;
}

// ---------------------------------------------------------------- sheets

    <button class="btn primary" data-offer="yes">Build it again</button><button class="btn ghost" data-offer="no">Keep what I have</button>`;

}

// ---------------------------------------------------------------- render
function render() {

  const html = p.p === "root" ? (S.v === "A" ? aRoot() : S.v === "B" ? bRoot() : S.v === "D" ? dRoot() : cRoot())
    : p.p === "day" ? (S.v === "D" ? dDay(p.id) : aDay(p.id)) : p.p === "days" ? bDays() : p.p === "settings" ? bar("Settings") + `<div class="scroll"><div class="rhead"><div class="nm">${R().name}</div></div>${settingsRows()}<button class="btn quiet" data-sheet="rename:routine">Rename routine</button><button class="btn quiet" style="color:var(--warn)" data-toast="Delete routine: asks first">Delete routine</button></div>`
    : p.p === "muscles" ? bar("Muscles") + `<div class="scroll">${"CD".includes(S.v) ? dMuscles() : musclesBody(true)}</div>`
    : p.p === "q" ? settingQ(p.k) : p.p === "picker" ? picker(p.mode, p.did, p.k) : "";
  const hadFocus = document.activeElement && document.activeElement.id === "q", pos = hadFocus ? document.activeElement.selectionStart : 0;
  const sc = app.querySelector(".scroll"), keepScroll = sc && app.dataset.page === JSON.stringify(p) ? sc.scrollTop : 0;
  app.innerHTML = html; app.dataset.page = JSON.stringify(p);
  const sc2 = app.querySelector(".scroll"); if (sc2) sc2.scrollTop = keepScroll;
  if (hadFocus) { const i = document.getElementById("q"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }
  const s = sheet();
  document.getElementById("layers").innerHTML = s ? `<div class="scrim" data-back></div><div class="sheet" role="dialog">${sheetBody(s)}</div>` : "";
  if (s && /^(rename|addday)/.test(s.sheet)) setTimeout(() => document.getElementById("nm")?.focus(), 50);
  renderProto();
}
function renderProto() {
  const p = document.getElementById("proto"), th = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  p.className = "proto" + (S.minP ? " min" : "");

    `<div class="hr"></div>` + [["sample","Sample PPL"],["empty","Empty start"]].map(([k,l]) => `<button data-data="${k}" class="${S.data===k?"on":""}">${l}</button>`).join("") +
    `<div class="hr"></div>` + ["dark","light"].map(k => `<button data-theme="${k}" class="${th===k?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("");
  try { localStorage.setItem("routine-proto", JSON.stringify({ v:S.v, theme:document.documentElement.dataset.theme })); } catch (e) {}

function reset(v, data) {
  S.v = v; S.data = data; S.R = data === "empty" ? empty() : sample(); S.stack = [{ p:"root" }]; S.tab = "days"; S.bDay = S.R.cursor; S.editing = data === "empty" && v === "C";

// ---------------------------------------------------------------- actions
function find(ref) { const [did, k] = ref.split(":"); const d = dayOf(did); return [d, d.ex.find(x => x.k === +k)]; }
function snapshot() { return JSON.stringify({ ...R(), equip:[...R().equip] }); }
function restore(s) { const o = JSON.parse(s); o.equip = new Set(o.equip); S.R = o; }
function rebuild() {
  const before = snapshot(), have = e => e.eq === "body only" || R().equip.has(e.eq);
  R().rot.forEach(d => { const used = new Set(d.ex.filter(e => e.kept).map(e => e.id));
    d.ex = d.ex.map(e => { if (e.kept) return e; const b = BY[e.id];
      const alts = BANK.filter(x => x.p[0] === b.p[0] && have(x) && !used.has(x.id));
      const pick = alts.filter(x => x.id !== e.id)[Math.floor(Math.random() * Math.max(1, alts.length - 1))] || alts[0] || b;
      used.add(pick.id); return { ...e, k: uid++, id: pick.id }; }); });
  S.undo = before; toast("Built again. Kept lifts stayed.", true);
}
let dayKind = "lift";
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-back]"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.v) return reset(d.v, S.data);
  if (d.data) return reset(S.v, d.data);
  if (d.theme) { document.documentElement.dataset.theme = d.theme; return renderProto(); }
  if ("pmin" in d) { S.minP = !S.minP; return renderProto(); }
  if ("back" in d) return back();
  if (d.toast) return toast("Prototype: " + d.toast);
  if ("undo" in d) { if (S.undo) { restore(S.undo); S.undo = null; document.getElementById("toast").hidden = true; render(); } return; }
  if (d.go) { S.revised = ""; S.editing = false; const [p, id] = d.go.split(":"); return push({ p, id }); }
  if (d.tab) { S.tab = d.tab; S.revised = ""; return render(); }
  if (d.bday) { S.bDay = d.bday; S.revised = ""; return render(); }
  if ("edit" in d) { S.editing = !S.editing; S.revised = ""; return render(); }
  if (d.sheet) return sheet() ? swapTop({ sheet:d.sheet }) : push({ sheet:d.sheet });
  if (d.exsheet) return push({ sheet:"ex:" + d.exsheet });
  if (d.set) return push({ p:"q", k:d.set, before:snapshot() });
  if (d.pick) { const [mode, did] = d.pick.split(":"); S.q = ""; return push({ p:"picker", mode, did }); }
  if (d.replace) { const [did, k] = d.replace.split(":"); S.q = ""; const e = { p:"picker", mode:"replace", did, k }; return sheet() ? swapTop(e) : push(e); }
  if (d.filter) { S.pickFilter = d.filter; return render(); }
  if (d.picked) {
    const p = page(), day = dayOf(p.did);
    if (p.k) { const i = day.ex.findIndex(x => x.k === +p.k); const old = day.ex[i]; day.ex[i] = { ...old, k: uid++, id: d.picked, kept:false }; toast(`${BY[old.id].name} → ${BY[d.picked].name}`); }
    else { day.ex.push(ex(d.picked, 3)); toast(`Added ${BY[d.picked].name}`); }
    return back();
  }
  if (d.keep) { const [, e] = find(d.keep); e.kept = !e.kept; return render(); }
  if (d.remove) { const [day, e] = find(d.remove); const before = snapshot(); day.ex = day.ex.filter(x => x !== e); S.undo = before; toast(`Removed ${BY[e.id].name}`, true); if (sheet()) return back(); return render(); }
  if (d.move) { const [id, dir] = d.move.split(":"); const rot = R().rot, i = rot.findIndex(x => x.id === id), j = i + +dir;
    if (j < 0 || j >= rot.length) return; [rot[i], rot[j]] = [rot[j], rot[i]]; revise(`Moved ${rot[j].name}.`); if (sheet()) return back(); return render(); }
  if (d.rmday) { const day = dayOf(d.rmday); R().rot = R().rot.filter(x => x.id !== d.rmday); revise(`Removed ${day.name}.`);
    const onDay = page().p === "day" && page().id === d.rmday; return backN(onDay ? 2 : 1); }
  if (d.daykind) { dayKind = d.daykind; document.querySelectorAll("[data-daykind]").forEach(b => b.classList.toggle("on", b.dataset.daykind === dayKind)); return; }
  if ("addday" in d) { const nm = document.getElementById("nm").value.trim() || (dayKind === "cardio" ? "Cardio" : `Day ${R().rot.length + 1}`);
    const id = "d" + uid++; R().rot.push({ id, name:nm, cardio: dayKind === "cardio", ex:[] }); revise(`Added ${nm}.`); S.bDay = id; dayKind = "lift"; return back(); }
  if (d.rename) { const v = document.getElementById("nm").value.trim(); if (v) { if (d.rename === "routine") R().name = v; else dayOf(d.rename).name = v; } return back(); }
