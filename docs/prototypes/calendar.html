<title>Training Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<!--
  THROWAWAY PROTOTYPE - not production code. Wayfinder ticket #137
  "Prototype: the calendar" (map #130 "Map: UI overhaul").

  Question: how should the calendar look and behave, and the single day it opens into?

  Shared by every variant:
    - Swipe sideways between months (or use the arrows). Nothing before the first month
      with history, nothing after this month.
    - What was done, never what was not (ADR 0008): no streaks, no missed-day marks.
      A skipped day looks exactly like a rest day.
    - A trained day shows its routine day name (Push, Pull, Legs) when it came from the
      routine, and muscle tags worked out from the sets actually logged, so freestyle and
      imported sessions get tags too. Muscle colours are the new look's (ui-overhaul).
    - Sample history: June and July imported from FitNotes (no day names), August and
      September from a Push / Pull / Legs routine, with freestyle sessions, cardio-only
      days, a lift + cardio day, weigh-ins, a superset, a drop set and a per-side lift.
    - The same single-day page for every variant. Tap a set to correct it; add a missed set.
    - Back is real browser history.

  Three variants disagree about the month:
    A  Grid + card - a month grid with a coloured name tag on each trained day. Tap a day
                     for a summary card under the grid; the card opens the day.
    B  List        - no grid. The month's trained days as big rows: date, name, muscle chips
                     and a small diagram. Rest days simply aren't there.
    C  Full grid   - (CHOSEN) tall cells filled with bands of muscle colour for what was trained,
                     the name on top. Under it, when each muscle was last trained.
                     Round 2: a weigh-in shows as a scale icon and the weight (was a bare dot),
                     and the last-trained strip shows all ten groups in two rows, in body order,
                     so it doubles as the colour key (was a sideways scroll showing ~4).

  Switch with the floating panel (top right) or the arrow keys. All data is made up.
-->
<style>

           background: #0a0a0a; color: #fff; border: 1px dashed #ff3bd4; border-radius: 12px; padding: 4px; font: 600 12px/1.2 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.5); }

</style>

<script>
const NAMES = { A:"Grid + card", B:"List", C:"Full grid" };
const TODAY = new Date(2026, 8, 30);   // 30 Sep 2026
const P = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const svg = (d, st="") => `<svg class="ico" ${st?`style="${st}"`:""} viewBox="0 0 24 24" ${P}>${d}</svg>`;
const IC = {
  back:'<path d="M15 5l-7 7 7 7"/>', prev:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>',
  today:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  routine:'<path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/>', more:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  barbell:'<path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/>',
  dumbbell:'<rect x="4" y="8" width="4" height="8" rx="1"/><rect x="16" y="8" width="4" height="8" rx="1"/><path d="M8 12h8M2 11v2M22 11v2"/>',
  cable:'<path d="M4 3v18M4 3h9"/><circle cx="13" cy="5" r="2"/><path d="M15 5v10M12 18h6M15 15v3"/>',
  machine:'<path d="M5 3v18M19 3v18M5 3h14M12 3v7"/><rect x="8" y="10" width="8" height="3"/><rect x="8" y="14" width="8" height="3"/><rect x="8" y="18" width="8" height="3"/>',
  body:'<circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10l5-1 5 1M12 14l-3 7M12 14l3 7"/>',
  rower:'<path d="M3 19h18M5 19v-3M19 19v-3"/><circle cx="18" cy="12" r="3"/><path d="M6 15h4M15 12l-7-3"/>',
  treadmill:'<circle cx="11" cy="4" r="1.5"/><path d="M8 13l2-4 3 2 2-1M10 9l-1 4 2 2"/><path d="M3 19h14l3-9h-2M5 21h12"/>',
  scale:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9a4 4 0 0 1 6 0l-3 3"/>',
};
const MC = { Chest:"#F28B82", Back:"#8AB4F8", Shoulders:"#FDD663", Triceps:"#C58AF9", Biceps:"#78D9EC", Quads:"#81C995", Hamstrings:"#FCAD70", Glutes:"#FF8BCB", Calves:"#A8C7A0", Core:"#D7CCC8" };
const GROUP = { chest:"Chest", lats:"Back", "middle back":"Back", traps:"Back", "lower back":"Back", shoulders:"Shoulders", triceps:"Triceps", biceps:"Biceps", forearms:"Biceps",
  quadriceps:"Quads", hamstrings:"Hamstrings", glutes:"Glutes", calves:"Calves", abdominals:"Core" };

// ---------------------------------------------------------------- exercises (plain names)
const X = {
  bench:["Bench press","barbell",["chest"],["shoulders","triceps"],80], ohp:["Overhead press","barbell",["shoulders"],["triceps"],50],
  incline:["Incline dumbbell press","dumbbell",["chest"],["shoulders","triceps"],30], lateral:["Lateral raise","dumbbell",["shoulders"],[],10],
  pushdown:["Triceps pushdown","cable",["triceps"],[],30], row:["Barbell row","barbell",["middle back"],["lats","biceps"],70],
  pulldown:["Lat pulldown","cable",["lats"],["biceps"],60], crow:["Seated cable row","cable",["middle back"],["lats","biceps"],55],
  face:["Face pull","cable",["shoulders"],["traps"],25], curl:["Dumbbell curl","dumbbell",["biceps"],[],14],
  squat:["Squat","barbell",["quadriceps"],["glutes","hamstrings"],100], rdl:["Romanian deadlift","barbell",["hamstrings"],["glutes","lower back"],90],
  press:["Leg press","machine",["quadriceps"],["glutes"],160], lcurl:["Leg curl","machine",["hamstrings"],[],45], calf:["Standing calf raise","machine",["calves"],[],80],
  bss:["Bulgarian split squat","dumbbell",["quadriceps"],["glutes","hamstrings"],20], pullup:["Pull-up","body only",["lats"],["biceps"],0],
  plank:["Plank","body only",["abdominals"],[],0], dips:["Dips","body only",["triceps"],["chest","shoulders"],0],
};
const EQI = { barbell:"barbell", dumbbell:"dumbbell", cable:"cable", machine:"machine", "body only":"body" };

// ---------------------------------------------------------------- made-up history (deterministic)
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const fromKey = k => { const [y, m, d] = k.split("-"); return new Date(+y, +m - 1, +d); };
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const TPL = {
  Push:["bench","ohp","incline",["lateral","pushdown"]], Pull:["row","pulldown","crow","face","curl"], Legs:["squat","rdl","press","lcurl","calf"],
  Upper:["bench","row","ohp","pulldown","curl","pushdown"], Lower:["squat","rdl","press","calf"],
};
function sets(id, when, opts={}) {
  const base = X[id][4], prog = 1 + (when - new Date(2026,5,1)) / (86400000 * 900), out = [];
  const w = Math.round(base * prog / 2.5) * 2.5;
  if (opts.warm && base) { out.push({ t:"warm", w: Math.round(w*.5/2.5)*2.5, r:8 }); out.push({ t:"warm", w: Math.round(w*.75/2.5)*2.5, r:4 }); }
  const n = id === "calf" ? 4 : id === "face" ? 2 : 3;
  for (let i = 0; i < n; i++) out.push(id === "plank" ? { t:"work", sec: 45 + i*5 } : { t:"work", w, r: 10 - i - (rnd() < .3 ? 1 : 0) });
  if (opts.drop) out.push({ t:"drop", w: Math.round(w*.7/2.5)*2.5, r: 8 });
  if (opts.side) out.forEach(s => { s.side = true; s.r2 = s.r - (rnd() < .5 ? 1 : 0); });
  return out;
}
function liftSession(name, list, when, src) {

// swipe: the month follows the finger, and past a quarter of the width it turns
let sx = null, sy = null, dx = 0, lock = null;
