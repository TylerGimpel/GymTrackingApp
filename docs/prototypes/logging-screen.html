<title>Logging Screen Variants</title>

<!--
  THROWAWAY PROTOTYPE - not production code, no tests, no error handling.

  Question: what does the live logging screen look like, and how does it behave?
  Three structurally different variants on one route, switchable via ?variant=A|B|C
  and the floating bar at the bottom.

  Sub-shape B (new page) is forced: this repo has no app yet, only docs, so there
  is no existing page to host the variants inside.

  Built mobile-first. Open it on a phone - the question is about one-handed use
  at arm's length, which a desktop browser cannot answer.
-->

<style>
  :root {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --surface-2: #ebebed;
    --line: #d9d9de;
    --text: #17171a;
    --text-dim: #6b6b75;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --good: #15803d;
    --warn: #b45309;
    --calib: #7c3aed;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d10; --surface: #17171c; --surface-2: #212128; --line: #2e2e38;
      --text: #f2f2f5; --text-dim: #9a9aa8; --accent: #3b82f6;
      --good: #22c55e; --warn: #f59e0b; --calib: #a78bfa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d10; --surface: #17171c; --surface-2: #212128; --line: #2e2e38;
    --text: #f2f2f5; --text-dim: #9a9aa8; --accent: #3b82f6;
    --good: #22c55e; --warn: #f59e0b; --calib: #a78bfa;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 0 0 88px;
    max-width: 480px; margin-inline: auto;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--surface);
    border-bottom: 1px solid var(--line); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .day { font-weight: 650; font-size: 16px; }
  .topbar .clock { margin-left: auto; text-align: right; font-size: 12px; color: var(--text-dim); line-height: 1.25; }
  .topbar .clock b { display: block; font-size: 14px; color: var(--text); font-variant-numeric: tabular-nums; }

  .wrap { padding: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

  .exname { font-size: 20px; font-weight: 680; letter-spacing: -0.01em; }
  .row { display: flex; align-items: center; gap: 10px; }
  .dim { color: var(--text-dim); }
  .tabnum { font-variant-numeric: tabular-nums; }

  .chip {
    font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-dim);
  }
  .chip.warmup { color: var(--warn); }
  .chip.working { color: var(--good); }
  .chip.calib { color: var(--calib); }
  .chip.drop { color: var(--accent); }

  .modebadge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    background: var(--surface-2);
  }
  .modebadge.calibrating { color: var(--calib); }
  .modebadge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .counter { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .counter b { color: var(--text); font-weight: 620; }

  .iconbtn {
    width: 38px; height: 38px; border-radius: 10px; background: var(--surface-2);
    display: grid; place-items: center; font-size: 16px;
  }

  .hint { font-size: 12.5px; color: var(--text-dim); }
  .hint.effort { color: var(--warn); }

  /* rest timer */
  .rest {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    max-width: 480px; margin-inline: auto;
    background: var(--accent); color: var(--accent-text);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
    transform: translateY(110%); transition: transform .22s ease;
  }
  .rest.on { transform: none; }
  .rest .t { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 76px; }
  .rest .lab { font-size: 12px; opacity: .85; line-height: 1.25; }
  .rest button { background: rgba(255,255,255,.18); padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; }
  .rest .spacer { margin-left: auto; display: flex; gap: 7px; }

  /* switcher */
  .switcher {
    position: fixed; z-index: 60; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px;
    background: #111318; color: #fff; border: 1px solid #3a3f4b;
    border-radius: 999px; padding: 5px 6px; box-shadow: 0 6px 24px rgba(0,0,0,.45);
    font-size: 12px;
  }
  .switcher button { padding: 5px 10px; border-radius: 999px; font-size: 15px; line-height: 1; }
  .switcher .lbl { padding: 0 8px; white-space: nowrap; font-weight: 600; letter-spacing: .01em; }
  .switcher .lbl span { opacity: .6; font-weight: 500; }

  /* ---------- Variant A ---------- */
  .a-presc { text-align: center; padding: 20px 14px 8px; }
  .a-presc .big { font-size: 54px; font-weight: 730; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .a-presc .big small { font-size: 21px; font-weight: 600; color: var(--text-dim); }
  .a-step { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .a-step .grp { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 6px; }
  .a-step .grp b { min-width: 54px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
  .a-step .grp button { width: 40px; height: 40px; border-radius: 9px; background: var(--surface); font-size: 19px; font-weight: 600; }
  .a-step .cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); text-align: center; margin-bottom: 4px; }
  .a-log {
    width: 100%; margin-top: 18px; padding: 20px; border-radius: 16px;
    background: var(--accent); color: var(--accent-text); font-size: 19px; font-weight: 700;
  }
  .a-log.done { background: var(--good); }
  .a-next { margin-top: 14px; font-size: 13px; color: var(--text-dim); text-align: center; }

  /* ---------- Variant B ---------- */
  .b-list { margin-top: 10px; }
  .b-set {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px;
    border-bottom: 1px solid var(--line);
  }
  .b-set:last-child { border-bottom: none; }
  .b-set.cur { background: var(--surface-2); }
  .b-set.logged .val { color: var(--text-dim); }
  .b-set .n { width: 20px; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .b-set .val { font-size: 16px; font-weight: 620; font-variant-numeric: tabular-nums; }
  .b-set .prev { font-size: 11.5px; color: var(--text-dim); }
  .b-set .tick { margin-left: auto; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; }
  .b-set .tick.idle { background: transparent; color: var(--text-dim); }
  .b-set.logged .tick { background: transparent; color: var(--good); }
  .b-edit { display: flex; gap: 8px; padding: 0 12px 12px; }
  .b-edit input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; font-weight: 600; text-align: center;
    padding: 11px 6px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums;
  }
  .b-rest { padding: 8px 12px; font-size: 12px; color: var(--accent); font-weight: 600; }
  .b-day { margin-top: 14px; }
  .b-dayrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .b-dayrow:last-child { border-bottom: none; }
  .b-dayrow.cur { font-weight: 650; }
  .b-dayrow .s { margin-left: auto; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  /* ---------- Variant C ---------- */
  .c-top { padding: 16px 14px 10px; }
  .c-dials { margin-top: 16px; }
  .c-dial { margin-bottom: 14px; }
  .c-dial .cap { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 6px; }
  .c-dial .cap b { font-size: 22px; text-transform: none; letter-spacing: -0.01em; color: var(--text); font-variant-numeric: tabular-nums; }
  .c-track {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  }
  .c-track::-webkit-scrollbar { display: none; }
  .c-track button {
    flex: 0 0 auto; scroll-snap-align: center; min-width: 62px; padding: 13px 8px;
    border-radius: 12px; background: var(--surface-2); font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums; border: 2px solid transparent;
  }
  .c-track button.sel { background: var(--accent); color: var(--accent-text); }
  .c-track button.rec { border-color: var(--accent); }
  .c-log { width: 100%; padding: 19px; border-radius: 16px; background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 700; }
  .c-log.done { background: var(--good); }

  /* cardio */
  .cardio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .cardio-f { background: var(--surface-2); border-radius: 12px; padding: 11px 12px; }
  .cardio-f .cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
  .cardio-f .v { font-size: 21px; font-weight: 660; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .cardio-f.opt { opacity: .62; }

  /* sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: none; }
  .scrim.on { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 480px; margin-inline: auto;
    background: var(--surface); border-radius: 18px 18px 0 0; padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .24s ease; max-height: 82vh; overflow-y: auto;
  }
  .sheet.on { transform: none; }
  .sheet h3 { margin: 0 0 3px; font-size: 17px; }
  .sheet .sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
  .cand { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); margin-bottom: 8px; }
  .cand .nm { font-weight: 600; font-size: 14.5px; }
  .cand .mt { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
  .cand .tag { margin-left: auto; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
  .cand .tag.hist { color: var(--good); }
  .cand .tag.new { color: var(--calib); }
  .sheet .act { display: block; width: 100%; padding: 14px; border-radius: 12px; background: var(--surface-2); font-weight: 620; margin-top: 8px; text-align: center; }
  .sheet .act.primary { background: var(--accent); color: var(--accent-text); }

  /* ---------- Variant D: wheel + drawer (synthesis of A and B) ---------- */
  .d-handle {
    position: fixed; left: max(0px, calc(50% - 240px)); top: 50%; transform: translateY(-50%); z-index: 25;
    width: 22px; height: 92px; border-radius: 0 12px 12px 0;
    background: var(--surface-2); border: 1px solid var(--line); border-left: none;
    display: grid; place-items: center; color: var(--text-dim); font-size: 13px;
  }
  .d-wheel {
    height: 46vh; min-height: 290px; overflow-y: auto; overscroll-behavior: contain;
    scroll-snap-type: y mandatory; perspective: 800px; perspective-origin: 50% 50%;
    margin: 0 -14px; padding: 0 14px;
  }
  .d-wheel::-webkit-scrollbar { display: none; }
  .d-pad { height: calc(23vh - 55px); min-height: 90px; }
  .d-slot {
    height: 110px; scroll-snap-align: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    transition: opacity .12s linear; will-change: transform, opacity;
  }
  .d-slot .d-chips { display: flex; gap: 5px; }
  .d-slot .d-val { font-size: 19px; font-weight: 620; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .d-slot .d-val small { color: var(--text-dim); font-size: .72em; font-weight: 550; }
  /* The unit stays tappable to toggle kg/lb, but carries no underline —
     the affordance is taught once elsewhere, not decorated on every set. */
  .d-slot.focus .d-val small.unit { cursor: pointer; }
  .a-step .grp b { cursor: pointer; }
  .d-slot .d-prev { font-size: 11.5px; color: var(--text-dim); }
  .d-slot.focus .d-val { font-size: 46px; font-weight: 730; letter-spacing: -0.03em; }
  .d-slot.focus .d-prev { font-size: 13px; }
  .d-slot.logged .d-val { color: var(--text-dim); }
  .d-slot.logged .d-val::after { content: ' ✓'; color: var(--good); }

  .d-ctrl {
    position: sticky; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); margin: 0 -14px -14px; padding: 12px 14px 14px;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .d-hintline { text-align: center; margin-bottom: 10px; min-height: 17px; }

  .drawer {
    position: fixed; top: 0; bottom: 0; left: max(0px, calc(50% - 240px)); z-index: 50; width: 82%; max-width: 330px;
    background: var(--surface); border-right: 1px solid var(--line);
    transform: translateX(-102%); transition: transform .22s ease;
    overflow-y: auto; padding: 16px 0 24px;
  }
  .drawer.on { transform: none; }
  .drawer h3 { margin: 0 16px 2px; font-size: 16px; }
  .drawer .sub { margin: 0 16px 12px; font-size: 12px; color: var(--text-dim); }
  .drawer .dex { display: flex; align-items: center; gap: 9px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .drawer .dex.cur { background: var(--surface-2); }
  .drawer .dex .nm { font-size: 14px; font-weight: 560; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer .dex.cur .nm { font-weight: 680; }
  .drawer .dex .s { margin-left: auto; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .drawer .dex .bar { width: 34px; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .drawer .dex .bar i { display: block; height: 100%; background: var(--good); }

  .toast {
    position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 15px; border-radius: 11px;
    font-size: 13px; font-weight: 560; z-index: 70; opacity: 0; transition: all .2s; pointer-events: none;
    max-width: 90vw; text-align: center;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="topbar">
  <div>
    <div class="day" id="dayName">Push</div>
    <div class="counter" id="posCounter"></div>
  </div>
  <div class="clock">
    <b id="elapsed">0:00</b>
    <span id="remaining">~52 min left</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="rest" id="rest">
  <div class="t" id="restT">2:00</div>
  <div class="lab" id="restLab">Rest<br>working set</div>
  <div class="spacer">
    <button onclick="addRest(30)">+30s</button>
    <button onclick="skipRest()">Skip</button>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeSheet();closeDrawer()"></div>
<div class="sheet" id="sheet"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<div class="switcher">
  <button onclick="cycle(-1)" aria-label="Previous variant">‹</button>
  <div class="lbl" id="vlabel"></div>
  <button onclick="cycle(1)" aria-label="Next variant">›</button>
</div>

<script>
// ---------------------------------------------------------------- state
const VARIANTS = { D: 'Wheel + drawer', A: 'Big accept', B: 'Set list', C: 'Dial' };

function mkSets(spec) {
  return spec.map((s, i) => ({
    idx: i, type: s.t, recW: s.w, recR: s.r, w: s.w, r: s.r,
    rest: s.rest, drops: s.drops || null, done: false, prev: s.prev || null
  }));
}

const session = {
  day: 'Push',
  startedAt: Date.now() - 14 * 60000,
  exercises: [
    {
      name: 'Barbell Bench Press', mode: 'prescribing', unit: 'kg', type: 'weight_reps',
      group: null,
      sets: mkSets([
        { t: 'warmup', w: 20, r: 10, rest: 45 },
        { t: 'warmup', w: 45, r: 5,  rest: 45 },
        { t: 'warmup', w: 65, r: 3,  rest: 60 },
        { t: 'working', w: 82.5, r: 8, rest: 150, prev: '80 × 8' },
        { t: 'working', w: 82.5, r: 8, rest: 150, prev: '80 × 7' },
        { t: 'working', w: 82.5, r: 8, rest: 150, prev: '80 × 6' },
        { t: 'working', w: 82.5, r: 8, rest: 150, prev: '77.5 × 8' }
      ])
    },
    {
      name: 'Incline Hammer Strength Chest Press', mode: 'prescribing', unit: 'kg', type: 'weight_reps',
      group: null,
      sets: mkSets([
        { t: 'working', w: 60, r: 10, rest: 120, prev: '57.5 × 10' },
        { t: 'working', w: 60, r: 10, rest: 120, prev: '57.5 × 9' },
        { t: 'working', w: 60, r: 10, rest: 120, prev: '55 × 11' },
        { t: 'working', w: 50, r: 12, rest: 120, prev: '—', drops: [{ w: 40, r: 8 }, { w: 30, r: 6 }] }
      ])
    },
    {
      name: 'Seated Machine Fly', mode: 'prescribing', unit: 'kg', type: 'weight_reps',
      group: 'A',
      sets: mkSets([
        { t: 'working', w: 45, r: 12, rest: 0, prev: '45 × 12' },
        { t: 'working', w: 45, r: 12, rest: 0, prev: '45 × 11' },
        { t: 'working', w: 45, r: 12, rest: 0, prev: '42.5 × 12' }
      ])
    },
    {
      name: 'Rope Triceps Pushdown', mode: 'prescribing', unit: 'kg', type: 'weight_reps',
      group: 'A',
      sets: mkSets([
        { t: 'working', w: 32.5, r: 12, rest: 90, prev: '30 × 12' },
        { t: 'working', w: 32.5, r: 12, rest: 90, prev: '30 × 12' },
        { t: 'working', w: 32.5, r: 12, rest: 90, prev: '30 × 10' }
      ])
    },
    {
      name: 'Lateral Dumbbell Raise', mode: 'calibrating', unit: 'kg', type: 'weight_reps',
      group: null,
      sets: mkSets([
        { t: 'calibration', w: 6, r: 12, rest: 60 },
        { t: 'calibration', w: 8, r: 12, rest: 60 },
        { t: 'working', w: 10, r: 15, rest: 75 },
        { t: 'working', w: 10, r: 15, rest: 75 }
      ])
    },
    {
      name: 'Treadmill', mode: 'prescribing', unit: 'kg', type: 'distance_time',
      group: null, cardio: { mins: 20, km: 2.6, level: 'Incline 4', hr: null, rpe: null },
      sets: mkSets([{ t: 'working', w: 0, r: 0, rest: 0 }])
    }
  ],
  ei: 0, si: 3   // start mid-exercise so the screen shows a realistic middle state
};

let variant = new URLSearchParams(location.search).get('variant');
if (!VARIANTS[variant]) variant = 'D';

let restLeft = 0, restTimer = null, restLabel = '';

// ---------------------------------------------------------------- helpers
const KG_PER_LB = 0.45359237;
// Canonical storage is kg (settled decision). Display unit is a remembered
// property of the exercise - the two-lat-pulldown case: one machine in lb,
// one in kg, in the same gym. Toggling is display-only conversion.
function dispUnit(e) { return e.dispUnit || 'kg'; }
function toDisp(kg, u) { return u === 'lb' ? Math.round(kg / KG_PER_LB / 2.5) * 2.5 : kg; }
function fromDisp(v, u) { return u === 'lb' ? Math.round(v * KG_PER_LB * 4) / 4 : v; }
function stepFor(u) { return u === 'lb' ? 5 : 2.5; }
function toggleUnit() {
  const e = ex();
  e.dispUnit = dispUnit(e) === 'kg' ? 'lb' : 'kg';
  toast('Display unit for ' + e.name + ' is now ' + dispUnit(e) + ' - stored in kg either way');
  render();
}

const ex = () => session.exercises[session.ei];
const st = () => ex().sets[session.si];
const isCardio = e => e.type === 'distance_time';

function counters() {
  const e = ex(), all = e.sets.length;
  const workIdx = e.sets.filter(s => s.type === 'working' || s.type === 'amrap');
  const curWork = e.sets.slice(0, session.si + 1).filter(s => s.type === 'working' || s.type === 'amrap').length;
  return { all, n: session.si + 1, workTotal: workIdx.length, workN: Math.max(curWork, 1) };
}

function remainingMins() {
  let secs = 0;
  session.exercises.forEach((e, i) => {
    e.sets.forEach((s, j) => {
      if (i < session.ei || (i === session.ei && j < session.si)) return;
      if (s.done) return;
      secs += isCardio(e) ? e.cardio.mins * 60 : 40 + (s.rest || 0);
    });
  });
  return Math.round(secs / 60);
}

function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }

function tickClock() {
  const el = Math.floor((Date.now() - session.startedAt) / 1000);
  document.getElementById('elapsed').textContent = fmt(el);
  document.getElementById('remaining').textContent = '~' + remainingMins() + ' min left';
}
setInterval(tickClock, 1000);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600);
}

// ---------------------------------------------------------------- actions
function logSet() {
  const s = st(), e = ex();
  s.done = true;

  if (isCardio(e)) { toast('Cardio logged · session complete'); finishPrompt(); return; }

  const beatBy = s.r - s.recR;
  if (beatBy >= 4) toast('Beat target by ' + beatBy + ' reps — re-anchoring, next time ' + (s.w + 5) + ' kg');

  const rest = s.rest;
  restLabel = s.type === 'warmup' ? 'warm-up set' : s.type === 'calibration' ? 'calibration set' : 'working set';

  // superset: jump to the paired exercise rather than resting
  const grp = e.group;
  if (grp) {
    const partnerIdx = session.exercises.findIndex((o, i) => o.group === grp && i !== session.ei);
    const partner = session.exercises[partnerIdx];
    const nextUndone = partner.sets.findIndex(x => !x.done);
    if (nextUndone !== -1) {
      session.ei = partnerIdx; session.si = nextUndone;
      toast('Superset — jumped to ' + partner.name);
      render(); return;
    }
  }

  advance();
  if (rest > 0) startRest(rest);
  render();
}

function advance() {
  const e = ex();
  const next = e.sets.findIndex(x => !x.done);
  if (next !== -1) { session.si = next; return; }
  for (let i = session.ei + 1; i < session.exercises.length; i++) {
    const n = session.exercises[i].sets.findIndex(x => !x.done);
    if (n !== -1) { session.ei = i; session.si = n; return; }
  }
  finishPrompt();
}

function startRest(sec) {
  restLeft = sec;
  document.getElementById('rest').classList.add('on');
  document.getElementById('restLab').innerHTML = 'Rest<br>' + restLabel;
  clearInterval(restTimer);
  restTimer = setInterval(() => {
    restLeft--;
    document.getElementById('restT').textContent = fmt(Math.max(restLeft, 0));
    if (restLeft <= 0) { skipRest(); toast('Rest done'); }
  }, 1000);
  document.getElementById('restT').textContent = fmt(restLeft);
}
function addRest(n) { restLeft += n; document.getElementById('restT').textContent = fmt(restLeft); }
function skipRest() { clearInterval(restTimer); document.getElementById('rest').classList.remove('on'); }

function adj(field, delta) {
  const s = st();
  if (field === 'w') s.w = Math.max(0, Math.round((s.w + delta) * 4) / 4);
  else s.r = Math.max(0, s.r + delta);
  render();
}
function setVal(field, v) { const s = st(); s[field] = Number(v) || 0; render(); }

function jumpTo(ei, si) { session.ei = ei; session.si = si; render(); }

// ---------------------------------------------------------------- sheets
function openSheet(html) {
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

function swapSheet() {
  const cands = [
    { n: 'Dumbbell Bench Press', m: 'Chest · dumbbell · compound', tag: 'hist', note: 'last: 32.5 × 9' },
    { n: 'Smith Machine Close Grip Bench Press', m: 'Chest · machine · compound', tag: 'hist', note: 'last: 60 × 8' },
    { n: 'Chest Press Machine', m: 'Chest · machine · compound', tag: 'hist', note: 'last: 55 × 10' },
    { n: 'Decline Hammer Strength Chest Press', m: 'Chest · machine · compound', tag: 'new', note: 'no history — will calibrate' },
    { n: 'Push-Up', m: 'Chest · body only · compound', tag: 'new', note: 'no history — will calibrate' }
  ];
  openSheet(`
    <h3>Swap ${ex().name}</h3>
    <div class="sub">Ranked by what you've done before — those need no calibration.</div>
    ${cands.map(c => `
      <div class="cand" onclick="doSwap('${c.n.replace(/'/g, "\\'")}','${c.tag}')">
        <div><div class="nm">${c.n}</div><div class="mt">${c.m} · ${c.note}</div></div>
        <div class="tag ${c.tag}">${c.tag === 'hist' ? 'history' : 'new'}</div>
      </div>`).join('')}
    <button class="act" onclick="toast('(prototype) search + add-new not wired')">Search all exercises…</button>
    <button class="act" onclick="toast('(prototype) search + add-new not wired')">Add a new exercise</button>
  `);
}
function doSwap(name, tag) {
  const e = ex();
  e.name = name;
  if (tag === 'new') { e.mode = 'calibrating'; e.sets.forEach(s => { if (!s.done) s.type = 'calibration'; }); }
  closeSheet();
  toast(tag === 'new' ? 'Swapped — no history, so calibrating' : 'Swapped — history found, prescribing');
  render();
}

function skipPrompt() {
  openSheet(`
    <h3>You've skipped this in 6 of the last 8 sessions</h3>
    <div class="sub">Lateral Dumbbell Raise</div>
    <button class="act" onclick="closeSheet();toast('Kept — nothing changed')">Keep it</button>
    <button class="act" onclick="closeSheet();swapSheet()">Swap it</button>
    <button class="act" onclick="closeSheet();toast('Removed from recommendations')">Remove it</button>
  `);
}

function finishPrompt() {
  openSheet(`
    <h3>Finish this workout?</h3>
    <div class="sub">That was the last exercise in Push. 6 exercises · 22 sets · 71 min.</div>
    <button class="act primary" onclick="closeSheet();toast('Session finished and logged')">Finish workout</button>
    <button class="act" onclick="closeSheet()">Keep going</button>
  `);
}

// ---------------------------------------------------------------- render
function header(e) {
  const c = counters();
  document.getElementById('dayName').textContent = session.day;
  document.getElementById('posCounter').innerHTML =
    `Set <b>${c.n}</b> of ${c.all} · working <b>${c.workN}</b> of ${c.workTotal}`;
  return `
    <div class="row" style="margin-bottom:8px">
      <div style="min-width:0">
        <div class="exname">${e.name}</div>
        <div class="row" style="gap:6px;margin-top:6px">
          <span class="modebadge ${e.mode}"><span class="dot"></span>${e.mode === 'calibrating' ? 'finding your weight' : 'from your history'}</span>
          ${e.group ? '<span class="chip">superset</span>' : ''}
        </div>
      </div>
      <button class="iconbtn" style="margin-left:auto" onclick="swapSheet()" title="Swap">⇄</button>
    </div>`;
}

function modeHint(e, s) {
  if (e.mode === 'calibrating')
    return `<div class="hint" style="color:var(--calib)">Ramp up and stop when it gets hard. Being wrong here is expected.</div>`;
  if (s && s.r >= 15)
    return `<div class="hint effort">Take this close to failure — high reps only work hard.</div>`;
  return s && s.prev
    ? `<div class="hint">Last time: ${s.prev} · this weight comes from your logged sets</div>`
    : `<div class="hint">No previous set for this position</div>`;
}

function cardioPanel(e) {
  const c = e.cardio;
  return `
    <div class="cardio-grid">
      <div class="cardio-f"><div class="cap">Duration</div><div class="v">${c.mins} min</div></div>
      <div class="cardio-f"><div class="cap">Distance</div><div class="v">${c.km} km</div></div>
      <div class="cardio-f"><div class="cap">Setting</div><div class="v" style="font-size:16px">${c.level}</div></div>
      <div class="cardio-f opt"><div class="cap">Heart rate · optional</div><div class="v">—</div></div>
      <div class="cardio-f opt" style="grid-column:1/-1"><div class="cap">RPE · optional</div><div class="v">—</div></div>
    </div>
    <div class="hint" style="margin-top:10px">Target from last time — change anything, nothing is progressed automatically.</div>`;
}

function renderA() {
  const e = ex(), s = st();
  if (isCardio(e)) return `
    <div class="card" style="padding:14px">${header(e)}${cardioPanel(e)}
      <button class="a-log" onclick="logSet()">Log cardio</button></div>`;
  return `
    <div class="card" style="padding:14px">
      ${header(e)}
      <div class="a-presc">
        <div class="row" style="justify-content:center;margin-bottom:10px">
          <span class="chip ${s.type}">${s.type}</span>
          ${s.drops ? '<span class="chip drop">drop set</span>' : ''}
        </div>
        <div class="big">${s.w}<small> kg</small> × ${s.r}</div>
        <div style="margin-top:10px">${modeHint(e, s)}</div>
      </div>
      <div class="a-step">
        <div>
          <div class="cap">Weight · tap to type</div>
          <div class="grp"><button onclick="adj('w',-2.5)">−</button><b>${s.w}</b><button onclick="adj('w',2.5)">+</button></div>
        </div>
        <div>
          <div class="cap">Reps · tap to type</div>
          <div class="grp"><button onclick="adj('r',-1)">−</button><b>${s.r}</b><button onclick="adj('r',1)">+</button></div>
        </div>
      </div>
      ${s.drops ? `<div class="hint" style="text-align:center;margin-top:12px">then drop to ${s.drops.map(d => d.w + ' × ' + d.r).join(' → ')}</div>` : ''}
      <button class="a-log" onclick="logSet()">Log set</button>
      <div class="a-next">Next: ${nextLabel()}</div>
    </div>`;
}

function nextLabel() {
  const e = ex();
  const n = e.sets.findIndex(x => !x.done && x.idx > session.si);
  if (n !== -1) return 'set ' + (n + 1) + ' of ' + e.name;
  const ni = session.exercises.findIndex((o, i) => i > session.ei && o.sets.some(x => !x.done));
  return ni === -1 ? 'finish workout' : session.exercises[ni].name;
}

function renderB() {
  const e = ex(), s = st();
  if (isCardio(e)) return `
    <div class="card" style="padding:14px">${header(e)}${cardioPanel(e)}
      <button class="a-log" onclick="logSet()">Log cardio</button></div>`;
  return `
    <div class="card" style="padding:14px 14px 0">
      ${header(e)}
      <div class="b-list" style="margin:0 -14px">
        ${e.sets.map((x, i) => `
          <div class="b-set ${i === session.si ? 'cur' : ''} ${x.done ? 'logged' : ''}" onclick="jumpTo(${session.ei},${i})">
            <div class="n">${i + 1}</div>
            <span class="chip ${x.type}">${x.type.slice(0, 4)}</span>
            <div>
              <div class="val">${x.w} kg × ${x.r}</div>
              ${x.prev ? `<div class="prev">was ${x.prev}</div>` : ''}
            </div>
            <div class="tick ${x.done || i === session.si ? '' : 'idle'}">${x.done ? '✓' : (i === session.si ? '›' : '·')}</div>
          </div>
          ${i === session.si && !x.done ? `
            <div class="b-edit">
              <input type="number" inputmode="decimal" value="${x.w}" onchange="setVal('w',this.value)" aria-label="weight">
              <input type="number" inputmode="numeric" value="${x.r}" onchange="setVal('r',this.value)" aria-label="reps">
              <button class="tick" style="width:52px;height:auto" onclick="event.stopPropagation();logSet()">✓</button>
            </div>
            <div class="b-rest">${modeHint(e, x).replace(/<[^>]+>/g, '')}</div>` : ''}
        `).join('')}
      </div>
    </div>
    <div class="card b-day">
      ${session.exercises.map((o, i) => `
        <div class="b-dayrow ${i === session.ei ? 'cur' : ''}" onclick="jumpTo(${i},${Math.max(o.sets.findIndex(x => !x.done), 0)})">
          ${o.group ? '<span class="chip">SS</span>' : ''}
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.name}</span>
          <span class="s">${o.sets.filter(x => x.done).length}/${o.sets.length}</span>
        </div>`).join('')}
    </div>`;
}

function renderC() {
  const e = ex(), s = st();
  if (isCardio(e)) return `
    <div class="card" style="padding:14px">${header(e)}${cardioPanel(e)}
      <button class="c-log" onclick="logSet()">Log cardio</button></div>`;
  const wOpts = [], base = s.recW;
  for (let d = -3; d <= 4; d++) wOpts.push(Math.max(0, Math.round((base + d * 2.5) * 4) / 4));
  const rOpts = []; for (let d = -3; d <= 5; d++) rOpts.push(Math.max(1, s.recR + d));
  return `
    <div class="card c-top">
      ${header(e)}
      <div class="row" style="gap:6px;margin:10px 0 6px">
        <span class="chip ${s.type}">${s.type}</span>
        ${s.drops ? '<span class="chip drop">drop set</span>' : ''}
      </div>
      ${modeHint(e, s)}
      <div class="c-dials">
        <div class="c-dial">
          <div class="cap"><span>Weight</span><b>${s.w} kg</b></div>
          <div class="c-track">
            ${wOpts.map(v => `<button class="${v === s.w ? 'sel' : ''} ${v === s.recW ? 'rec' : ''}" onclick="setVal('w',${v})">${v}</button>`).join('')}
          </div>
        </div>
        <div class="c-dial">
          <div class="cap"><span>Reps</span><b>${s.r}</b></div>
          <div class="c-track">
            ${rOpts.map(v => `<button class="${v === s.r ? 'sel' : ''} ${v === s.recR ? 'rec' : ''}" onclick="setVal('r',${v})">${v}</button>`).join('')}
          </div>
        </div>
      </div>
      <button class="c-log" onclick="logSet()">Log ${s.w} kg × ${s.r}</button>
      <div class="a-next">Outlined = recommended · Next: ${nextLabel()}</div>
    </div>`;
}

// ---------------------------------------------------------------- variant D
// Synthesis: A's zoomed prescription as the focus of a vertical wheel, B's set
// rows receding above and below, B's routine overview moved to a left drawer.
// The wheel renders once per exercise; scrolling updates focus imperatively so
// a full re-render never fights the scroll position.

function renderD() {
  const e = ex();
  if (isCardio(e)) return `
    <div class="card" style="padding:14px">${header(e)}${cardioPanel(e)}
      <button class="a-log" onclick="logSet()">Log cardio</button></div>`;
  return `
    <div class="card" style="padding:14px">
      ${header(e)}
      <div class="d-wheel" id="dWheel">
        <div class="d-pad"></div>
        ${e.sets.map((x, i) => `
          <div class="d-slot ${x.done ? 'logged' : ''}" data-i="${i}">
            <div class="d-chips">
              <span class="chip ${x.type}">${x.type}</span>
              ${x.drops ? '<span class="chip drop">drop</span>' : ''}
            </div>
            <div class="d-val">${toDisp(x.w, dispUnit(e))}<small class="unit" onclick="event.stopPropagation();toggleUnit()"> ${dispUnit(e)}</small> × ${x.r}</div>
            <div class="d-prev">${x.prev ? 'was ' + x.prev : 'no previous set'}</div>
          </div>`).join('')}
        <div class="d-pad"></div>
      </div>
      <div class="d-ctrl">
        <div class="d-hintline" id="dHint"></div>
        <div class="a-step" style="margin-top:0">
          <div>
            <div class="cap">Weight · tap to type</div>
            <div class="grp"><button onclick="adjD('w',-1)">−</button><b id="dW" onclick="typeIn('w')">—</b><button onclick="adjD('w',1)">+</button></div>
          </div>
          <div>
            <div class="cap">Reps · tap to type</div>
            <div class="grp"><button onclick="adjD('r',-1)">−</button><b id="dR" onclick="typeIn('r')">—</b><button onclick="adjD('r',1)">+</button></div>
          </div>
        </div>
        <button class="a-log" id="dLog" onclick="logSet()">Log set</button>
      </div>
    </div>`;
}

let wheelRaf = null;
function wireWheel() {
  const w = document.getElementById('dWheel');
  if (!w) return;
  const slots = [...w.querySelectorAll('.d-slot')];
  const paint = () => {
    const mid = w.scrollTop + w.clientHeight / 2;
    let best = null, bestD = 1e9;
    slots.forEach(s => {
      const c = s.offsetTop + s.offsetHeight / 2;
      const d = (c - mid) / s.offsetHeight;
      const a = Math.abs(d);
      // 3D wheel falloff: rows tilt away and shrink with distance from centre
      s.style.transform = `translateZ(${-70 * a}px) rotateX(${Math.max(-52, Math.min(52, -d * 26))}deg) scale(${Math.max(0.62, 1 - a * 0.16)})`;
      s.style.opacity = String(Math.max(0.30, 1 - a * 0.34));
      s.classList.toggle('focus', a < 0.5);
      if (a < bestD) { bestD = a; best = s; }
    });
    if (best) {
      const i = Number(best.dataset.i);
      if (i !== session.si) { session.si = i; syncCtrl(); }
    }
  };
  w.addEventListener('scroll', () => {
    if (wheelRaf) return;
    wheelRaf = requestAnimationFrame(() => { wheelRaf = null; paint(); });
  }, { passive: true });
  const target = w.querySelector(`.d-slot[data-i="${session.si}"]`);
  if (target) w.scrollTop = target.offsetTop + target.offsetHeight / 2 - w.clientHeight / 2;
  paint(); syncCtrl();
}

function syncCtrl() {
  const s = st(), e = ex(), u = dispUnit(e);
  const W = document.getElementById('dW'), R = document.getElementById('dR');
  if (!W) return;
  W.textContent = toDisp(s.w, u) + ' ' + u; R.textContent = s.r;
  document.getElementById('dHint').innerHTML = modeHint(e, s);
  const btn = document.getElementById('dLog');
  btn.textContent = s.done ? 'Logged ✓ — log again' : 'Log set';
  btn.classList.toggle('done', !!s.done);
  const c = counters();
  document.getElementById('posCounter').innerHTML =
    `Set <b>${c.n}</b> of ${c.all} · working <b>${c.workN}</b> of ${c.workTotal}`;
}

function adjD(f, dir) {
  const s = st(), e = ex(), u = dispUnit(e);
  if (f === 'w') {
    const next = Math.max(0, toDisp(s.w, u) + dir * stepFor(u));
    s.w = fromDisp(next, u);
  } else {
    s.r = Math.max(0, s.r + dir);
  }
  paintSlot(); syncCtrl();
}

// Tap a value to type it, rather than stepping there one increment at a time.
// Matters most in calibrating mode, where overriding is the expected path.
function typeIn(f) {
  const s = st(), e = ex(), u = dispUnit(e);
  const host = document.getElementById(f === 'w' ? 'dW' : 'dR');
  if (host.querySelector('input')) return;
  const cur = f === 'w' ? toDisp(s.w, u) : s.r;
  host.innerHTML = `<input type="number" inputmode="decimal" value="${cur}"
      style="width:66px;font:inherit;font-size:15px;font-weight:inherit;text-align:center;
             background:var(--bg);color:var(--text);border:1px solid var(--accent);
             border-radius:7px;padding:3px 2px">`;
  const inp = host.querySelector('input');
  inp.focus(); inp.select();
  const commit = () => {
    const v = Number(inp.value);
    if (!Number.isNaN(v) && v >= 0) {
      if (f === 'w') s.w = fromDisp(v, u); else s.r = Math.round(v);
    }
    paintSlot(); syncCtrl();
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); } });
}

function paintSlot() {
  const s = st(), e = ex(), u = dispUnit(e);
  const el = document.querySelector(`.d-slot[data-i="${session.si}"] .d-val`);
  if (el) el.innerHTML = `${toDisp(s.w, u)}<small class="unit" onclick="event.stopPropagation();toggleUnit()"> ${u}</small> × ${s.r}`;
}

// ---- left drawer: the routine overview, swiped or tapped out
function openDrawer() {
  const d = document.getElementById('drawer');
  d.innerHTML = `
    <h3>${session.day}</h3>
    <div class="sub">Tap anything to jump there.</div>
    ${session.exercises.map((o, i) => {
      const done = o.sets.filter(x => x.done).length, tot = o.sets.length;
      return `<div class="dex ${i === session.ei ? 'cur' : ''}" onclick="jumpFromDrawer(${i})">
        ${o.group ? '<span class="chip">SS</span>' : ''}
        <span class="nm">${o.name}</span>
        <span class="bar"><i style="width:${Math.round(done / tot * 100)}%"></i></span>
        <span class="s">${done}/${tot}</span>
      </div>`;
    }).join('')}`;
  d.classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
function jumpFromDrawer(i) {
  const o = session.exercises[i];
  session.ei = i;
  session.si = Math.max(o.sets.findIndex(x => !x.done), 0);
  closeDrawer(); render();
}

// Opening the drawer by gesture.
//
// A swipe from the extreme left edge does NOT work reliably: on Android 10+
// gesture navigation that region is the system Back gesture, and in a browser
// it is swallowed before the page sees it. Apps can only carve out narrow
// exclusion rects and Google discourages it. So the edge swipe cannot be the
// affordance the drawer depends on - the tap handle is primary.
//
// What does work: a horizontal swipe anywhere. The wheel scrolls vertically,
// so a mostly-horizontal drag is unambiguous and never touches the OS zone.
let tX0 = null, tY0 = null;
addEventListener('touchstart', ev => {
  tX0 = ev.touches[0].clientX; tY0 = ev.touches[0].clientY;
}, { passive: true });
addEventListener('touchend', ev => {
  if (tX0 === null || variant !== 'D') return;
  const dx = ev.changedTouches[0].clientX - tX0;
  const dy = ev.changedTouches[0].clientY - tY0;
  const drawerOpen = document.getElementById('drawer').classList.contains('on');
  if (Math.abs(dx) > 60 && Math.abs(dy) < 45) {
    if (dx > 0 && !drawerOpen) openDrawer();
    if (dx < 0 && drawerOpen) closeDrawer();
  }
  tX0 = tY0 = null;
}, { passive: true });

function render() {
  const e = ex();
  document.getElementById('app').innerHTML =
    variant === 'A' ? renderA() : variant === 'B' ? renderB() :
    variant === 'C' ? renderC() : renderD();
  document.getElementById('vlabel').innerHTML = variant + ' <span>' + VARIANTS[variant] + '</span>';
  const h = document.querySelector('.d-handle');
  if (h) h.remove();
  if (variant === 'D') {
    const btn = document.createElement('button');
    btn.className = 'd-handle'; btn.innerHTML = '≡'; btn.title = 'Routine';
    btn.onclick = openDrawer;
    document.body.appendChild(btn);
    wireWheel();
  }
  tickClock();
}

function cycle(dir) {
  const ks = Object.keys(VARIANTS);
  variant = ks[(ks.indexOf(variant) + dir + ks.length) % ks.length];
  const u = new URL(location); u.searchParams.set('variant', variant);
  history.replaceState(null, '', u);
  render();
}

addEventListener('keydown', ev => {
  const t = ev.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || ev.target.isContentEditable) return;
  if (ev.key === 'ArrowLeft') cycle(-1);
  if (ev.key === 'ArrowRight') cycle(1);
});

render();
setTimeout(() => toast('Tap ≡ or swipe right for the routine · ‹ › switches layout'), 700);
</script>
