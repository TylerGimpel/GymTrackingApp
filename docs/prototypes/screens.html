<title>More Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<!--
  THROWAWAY PROTOTYPE - not production code. Wayfinder ticket #138
  "Prototype: the remaining screens" (map #130 "Map: UI overhaul").

  Question: how do the remaining screens look in the settled style, with less text?
  Exercise history and progress chart, the exercise bank, settings, profile, plates,
  weigh-ins, excluded exercises and the import preview.

  Mostly one design per screen, since the style is settled. Two real structural questions
  get variants, switched from the panel:
    More tab   A  List   - grouped rows with icons: Training, Setup, Your data.
               B  Tiles  - big 2-column tiles for the four you use most, rows for the rest.
    History    1  Chart first - the estimated max and strength chart on top, then bests,
                  sets per session, then every set.
               2  Sets first  - every session as a card, newest first, with a small
                  strength line pinned above.
               3  Tabs        - Progress · Sets · Settings for the one exercise.

  CHOSEN: More tab B (Tiles) and History 3 (Tabs). Round 2 fixed the exercise list's first
  group being squashed and clipped when the list ran past the screen, and let the
  equipment chips wrap onto two lines instead of scrolling sideways out of reach.

  The exercise picker is not here: the routine prototype settled it.
  Everything is made up. Back is real browser history.
-->
<style>
  :root {
    color-scheme: dark;
    --bg:#14130F; --surface:#1E1C17; --s2:#2A2720; --line:#3E392E; --text:#F5F2EA; --dim:#ABA590;

    --disp:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --r:6px; --rbig:10px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { color-scheme: light;
      --bg:#F6F4EE; --surface:#FFFFFF; --s2:#ECE8DD; --line:#D6CFBC; --text:#1A1813; --dim:#696350;
      --accent:#EDB800; --on:#1A1600; --at:#1A1813; --good:#2E8B3E; --warn:#A6461A; --scrim:rgba(20,18,12,.45); --m2:rgba(237,184,0,.45); --grid:#E6E1D4; }
  }
  :root[data-theme="light"] { color-scheme: light;
    --bg:#F6F4EE; --surface:#FFFFFF; --s2:#ECE8DD; --line:#D6CFBC; --text:#1A1813; --dim:#696350;
    --accent:#EDB800; --on:#1A1600; --at:#1A1813; --good:#2E8B3E; --warn:#A6461A; --scrim:rgba(20,18,12,.45); --m2:rgba(237,184,0,.45); --grid:#E6E1D4; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 var(--body); -webkit-user-select: none; user-select: none; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); height: 56px; padding: 0 14px; width: 100%; -webkit-user-select: text; user-select: text; }
  #app { max-width: 440px; margin-inline: auto; height: 100%; display: flex; flex-direction: column; position: relative; }
  .tnum { font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .label { font: 600 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; border-radius: var(--r);
         font: 700 22px/1 var(--disp); letter-spacing: .03em; text-transform: uppercase; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--on); }
  .btn.big { min-height: 72px; font-size: 28px; }
  .btn.ghost { background: var(--s2); }
  .btn.quiet { min-height: 48px; font-size: 18px; color: var(--dim); }
  .btn.dashed { border: 2px dashed var(--line); color: var(--dim); }
  .ico { width: 26px; height: 26px; flex: none; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .scroll > * { flex-shrink: 0; }
  .foot { flex: none; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
  .sect { margin-top: 12px; }
  .note { font-size: 15px; color: var(--dim); }

  .topbar { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 4px; flex: none; }
  .topbar h1 { margin: 0; font: 700 28px/1 var(--disp); text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; padding-left: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .back + h1 { padding-left: 0; }
  .ib { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r); flex: none; }
  nav.bn { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); flex: none; }
  nav.bn button { min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--dim); }

  nav.bn button[aria-current="page"] { color: var(--text); box-shadow: inset 0 3px 0 var(--accent); }
  nav.bn button[aria-current="page"] svg { color: var(--at); }

  /* rows */
  .rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .row:first-child { border-top: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font: 700 22px/1.05 var(--disp); text-transform: uppercase; }
  .row .t small { display: block; font-size: 14px; color: var(--dim); margin-top: 2px; }
  .row .v { font: 700 20px/1 var(--disp); }
  .row .ico.l { color: var(--dim); }
  .row .chev { color: var(--dim); width: 20px; height: 20px; }
  .eqi { width: 44px; height: 44px; border-radius: var(--r); background: var(--s2); display: grid; place-items: center; flex: none; color: var(--dim); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tiles.three { grid-template-columns: repeat(3, 1fr); }
  .tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 18px; min-height: 120px; padding: 14px;
          background: var(--surface); border: 1px solid var(--line); border-radius: var(--rbig); text-align: left; }
  .tile .ico { width: 34px; height: 34px; color: var(--at); }
  .tile b { font: 700 24px/1 var(--disp); text-transform: uppercase; }
  .tile small { display: block; font-size: 14px; color: var(--dim); margin-top: 4px; }
  .opt { display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 8px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font: 700 20px/1 var(--disp); text-transform: uppercase; text-align: center; }
  .opt.on { background: var(--accent); color: var(--on); border-color: var(--accent); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .fchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .fchips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--s2); font-weight: 600; font-size: 15px; }
  .fchip.on { background: var(--accent); color: var(--on); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin: 0 16px 8px; flex: none; }
  .tabs button { height: 44px; border-radius: 4px; font: 700 18px/1 var(--disp); letter-spacing: .05em; text-transform: uppercase; color: var(--dim); text-align: center; }
  .tabs button.on { background: var(--s2); color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); }

  /* hero numbers + charts */
  .hero { display: flex; align-items: flex-end; gap: 14px; }
  .hero .big { font: 700 64px/.9 var(--disp); }
  .hero .big small { font-size: 24px; color: var(--dim); margin-left: 4px; }
  .hero .d { font-size: 15px; color: var(--dim); padding-bottom: 6px; }
  .hero .d b { color: var(--good); }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--text); color: var(--bg); font: 600 13px/1.3 var(--body); padding: 5px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  .chart .tip[hidden] { display: none; }
  .key { display: flex; gap: 14px; font-size: 13px; color: var(--dim); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--m2); border: 1px solid var(--accent); }
  .key i.ln { width: 16px; height: 2px; border-radius: 1px; border: 0; background: var(--accent); }
  .recs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .rec { padding: 10px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); text-align: center; }
  .rec b { display: block; font: 700 22px/1 var(--disp); }
  .rec span { font-size: 12px; color: var(--dim); }
  .sess { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .sess .h { display: flex; justify-content: space-between; align-items: baseline; }
  .sess .h b { font: 700 20px/1 var(--disp); text-transform: uppercase; }
  .sess .h span { font-size: 13px; color: var(--dim); }
  .sets { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 700 19px/1.2 var(--disp); }
  .sets .w { color: var(--dim); font-size: 16px; }
  .sets .top { color: var(--at); }
  .muscbody { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 110px; flex: none; }
  .muscbody svg { width: 100%; height: auto; }
  .exhead { display: flex; gap: 14px; align-items: center; }
  .exhead .t { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .exhead .t .nm { font: 700 34px/1 var(--disp); text-transform: uppercase; }

  /* steppers + sheets */
  .stepper { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .stepper > button { width: 60px; height: 72px; font-size: 32px; flex: none; text-align: center; }
  .stepper .v { flex: 1; text-align: center; font: 700 40px/1 var(--disp); }
  .stepper .v small { font: 500 15px/1 var(--body); color: var(--dim); margin-left: 4px; }
  .stepper.sm > button { width: 48px; height: 52px; font-size: 26px; } .stepper.sm .v { font-size: 26px; }
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 440px; z-index: 21; background: var(--surface); border-top: 1px solid var(--line);
           border-radius: 14px 14px 0 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
  .sheet h3 { margin: 0; font: 700 30px/1 var(--disp); text-transform: uppercase; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat div { padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
  .stat b { display: block; font: 700 40px/1 var(--disp); }
  .stat span { font-size: 14px; color: var(--dim); }

  #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px; background: var(--text); color: var(--bg);
           padding: 0 8px 0 16px; min-height: 52px; border-radius: var(--r); font-weight: 600; font-size: 15px; width: calc(100% - 32px); max-width: 408px; }
  #toast[hidden] { display: none; }
  #toast button { margin-left: auto; height: 40px; padding: 0 12px; font: 700 18px/1 var(--disp); text-transform: uppercase; color: var(--accent); }
  .proto { position: fixed; z-index: 99; top: calc(env(safe-area-inset-top, 0px) + 60px); right: 6px; display: flex; flex-direction: column; gap: 2px;
           background: #0a0a0a; color: #fff; border: 1px dashed #ff3bd4; border-radius: 12px; padding: 4px; font: 600 12px/1.2 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .proto button { color: #fff; padding: 7px 8px; border-radius: 8px; text-align: left; }
  .proto button.on { background: #ff3bd4; color: #000; }
  .proto .hr { height: 1px; background: #333; margin: 2px 0; }
  .proto span { padding: 4px 8px; opacity: .6; }
  .proto.min > :not(.tog) { display: none; }
</style>

<div id="app"></div>
<div id="layers"></div>
<div id="toast" hidden></div>
<div class="proto" id="proto"></div>

<script>
const MORE = { A:"List", B:"Tiles" }, HIST = { 1:"Chart first", 2:"Sets first", 3:"Tabs" };
const P = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const svg = (d, cls="ico", st="") => `<svg class="${cls}" ${st?`style="${st}"`:""} viewBox="0 0 24 24" ${P}>${d}</svg>`;
const IC = {
  back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>', dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  today:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>', cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  routine:'<path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/>', more:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>', scale:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9a4 4 0 0 1 6 0l-3 3"/>',
  plate:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/>', person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M6 18L18 6"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  save:'<path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>', upload:'<path d="M12 21V9M7 14l5-5 5 5M4 5h16"/>', table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
  import:'<path d="M4 12h12M12 7l5 5-5 5"/><path d="M20 4v16"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  barbell:'<path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/>', dumbbell:'<rect x="4" y="8" width="4" height="8" rx="1"/><rect x="16" y="8" width="4" height="8" rx="1"/><path d="M8 12h8M2 11v2M22 11v2"/>',
  cable:'<path d="M4 3v18M4 3h9"/><circle cx="13" cy="5" r="2"/><path d="M15 5v10M12 18h6M15 15v3"/>',
  machine:'<path d="M5 3v18M19 3v18M5 3h14M12 3v7"/><rect x="8" y="10" width="8" height="3"/><rect x="8" y="14" width="8" height="3"/><rect x="8" y="18" width="8" height="3"/>',
  body:'<circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10l5-1 5 1M12 14l-3 7M12 14l3 7"/>', ezbar:'<path d="M2 12h3l2-2 2.5 4 2.5-4 2.5 4 2.5-4 2 2h3M5 8v8M19 8v8"/>',
  theme:'<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/>', timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>', unit:'<path d="M4 7h16M4 17h16M8 3v8M16 13v8"/>',
};

// ---------------------------------------------------------------- made-up data
const BANK = [
  ["Bench press","barbell","Chest","80 × 8"],["Squat","barbell","Quads","112.5 × 7"],["Deadlift","barbell","Lower back",null],["Overhead press","barbell","Shoulders","52.5 × 7"],
  ["Barbell row","barbell","Middle back","75 × 9"],["Romanian deadlift","barbell","Hamstrings","102.5 × 8"],["Incline dumbbell press","dumbbell","Chest","32 × 9"],
  ["Lateral raise","dumbbell","Shoulders","12 × 12"],["Dumbbell curl","dumbbell","Biceps","16 × 10"],["Hammer curl","dumbbell","Biceps",null],["Dumbbell row","dumbbell","Middle back",null],
  ["Lat pulldown","cable","Lats","65 × 10"],["Seated cable row","cable","Middle back","60 × 10"],["Triceps pushdown","cable","Triceps","32.5 × 11"],["Face pull","cable","Shoulders","27.5 × 12"],
  ["Leg press","machine","Quads","190 × 10"],["Leg curl","machine","Hamstrings","52.5 × 10"],["Standing calf raise","machine","Calves","90 × 10"],["Machine chest press","machine","Chest",null],
  ["Pull-up","body only","Lats",null],["Dips","body only","Triceps",null],["Push-up","body only","Chest",null],["Plank","body only","Abs",null],["EZ-bar curl","e-z curl bar","Biceps",null],["Skull crusher","e-z curl bar","Triceps",null],
].map(([name, eq, m, last]) => ({ name, eq, m, last }));
const EQI = { barbell:"barbell", dumbbell:"dumbbell", cable:"cable", machine:"machine", "body only":"body", "e-z curl bar":"ezbar" };
const EQN = { barbell:"Barbells", dumbbell:"Dumbbells", cable:"Cables", machine:"Machines", "body only":"Bodyweight", "e-z curl bar":"EZ bars" };

// bench press history: Feb to Sep; before 1 Aug imported from FitNotes (no warm-ups marked)
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const SEAM = new Date(2026, 7, 1), MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const e1 = (w, r) => w * (1 + r / 30);
const SESS = [];
for (let d = new Date(2026, 1, 3), i = 0; d <= new Date(2026, 8, 30); d.setDate(d.getDate() + 5 + Math.floor(rnd() * 4)), i++) {
  const base = 67.5 + i * 0.42 + (rnd() - .5) * 3, w = Math.round(base / 2.5) * 2.5, imported = d < SEAM;
  const sets = [];
  if (!imported) { sets.push({ w: Math.round(w * .5 / 2.5) * 2.5, r: 8, warm: true }); sets.push({ w: Math.round(w * .75 / 2.5) * 2.5, r: 4, warm: true }); }
  else { sets.push({ w: 40, r: 8 }); }
  const reps = [8 + Math.round(rnd()), 8, 7 - Math.round(rnd() * .6)];
  reps.forEach(r => sets.push({ w, r }));
  const best = Math.max(...sets.filter(s => !s.warm && s.w > 45).map(s => e1(s.w, s.r)));
  SESS.push({ date: new Date(d), sets, imported, best, working: sets.filter(s => !s.warm).length });
}
// the line moves part of the way toward each session, so one great day is a dot above it
let anchor = SESS[0].best; SESS.forEach(s => { anchor += (s.best - anchor) * .35; s.anchor = anchor; });
const RECS = {}; SESS.forEach(s => s.sets.filter(x => !x.warm && x.w > 45).forEach(x => { if (!RECS[x.r] || x.w > RECS[x.r].w) RECS[x.r] = { w: x.w, date: s.date }; }));
const fmtD = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const WEIGH = []; for (let d = new Date(2026, 1, 2), v = 85.2; d <= new Date(2026, 8, 28); d.setDate(d.getDate() + 7)) { v += (rnd() - .62) * .5; WEIGH.push({ date: new Date(d), kg: +v.toFixed(1) }); }

const S = { more:"A", hist:"1", stack:[{ p:"more" }], minP:false, q:"", eqf:"all", tab:"progress",
  unit:"kg", theme:"system", plates:[[25,2],[20,4],[15,2],[10,4],[5,4],[2.5,4],[1.25,2]], bar:20,
  profile:{ sex:null, exp:"trained", born:null, height:null }, excluded:["Kettlebell swing","Good morning","Upright row"],
  imports:[{ on:"12 Jun", n:118 }], draftKg:null, draftPlate:1.25, exSet:{ unit:"kg", repLo:null, repHi:null, step:null, never:false } };
try { const p = JSON.parse(localStorage.getItem("screens-proto")||"{}"); if (MORE[p.more]) S.more = p.more; if (HIST[p.hist]) S.hist = p.hist; if (p.theme) document.documentElement.dataset.theme = p.theme; } catch (e) {}

// ---------------------------------------------------------------- navigation
const topE = () => S.stack[S.stack.length - 1], pageE = () => [...S.stack].reverse().find(e => !e.sheet);
let hist = true;
function push(e) { S.stack.push(e); try { history.pushState({ d:S.stack.length }, ""); } catch (x) { hist = false; } render(); }
function back() { if (S.stack.length <= 1) return; if (hist) history.back(); else { S.stack.pop(); render(); } }
addEventListener("popstate", e => { const d = (e.state && e.state.d) || 1; S.stack.length = Math.max(1, Math.min(d, S.stack.length)); render(); });
let toastT; function toast(m, undo) { const t = document.getElementById("toast"); t.innerHTML = `<span>${m}</span>${undo ? `<button data-undo="${undo}">Undo</button>` : ""}`; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, undo ? 6000 : 2400); }

// ---------------------------------------------------------------- charts
function strengthChart(h=190, small=false) {
  const W = 360, pad = { l: small ? 6 : 34, r: 8, t: 10, b: small ? 6 : 22 };
  const xs = SESS.map(s => +s.date), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const vals = SESS.flatMap(s => [s.best, s.anchor]), lo = Math.floor(Math.min(...vals) / 5) * 5, hi = Math.ceil(Math.max(...vals) / 5) * 5;
  const X = t => pad.l + (t - x0) / (x1 - x0) * (W - pad.l - pad.r), Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
  const ticks = []; for (let v = lo; v <= hi; v += 10) ticks.push(v);
  const months = []; for (let m = 1; m <= 8; m++) months.push(new Date(2026, m, 1));
  const line = SESS.map((s, i) => `${i ? "L" : "M"}${X(+s.date).toFixed(1)},${Y(s.anchor).toFixed(1)}`).join("");
  const seamX = X(+SEAM);
  return `<div class="chart" data-chart="strength" data-w="${W}"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Estimated max over time">
    ${small ? "" : ticks.map(v => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${pad.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--dim)" font-family="Barlow">${v}</text>`).join("")}
    ${small ? "" : months.map(m => `<text x="${X(+m)}" y="${h - 4}" text-anchor="middle" font-size="11" fill="var(--dim)" font-family="Barlow">${MON[m.getMonth()]}</text>`).join("")}
    ${small ? "" : `<line x1="${seamX}" x2="${seamX}" y1="${pad.t}" y2="${h - pad.b}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${seamX - 4}" y="${pad.t + 10}" text-anchor="end" font-size="10" fill="var(--dim)" font-family="Barlow">FitNotes</text>`}
    ${SESS.map(s => `<circle cx="${X(+s.date)}" cy="${Y(s.best)}" r="${small ? 2.5 : 4}" fill="var(--m2)" stroke="var(--accent)" stroke-width="1"/>`).join("")}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(x1)}" cy="${Y(SESS[SESS.length-1].anchor)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    </svg><div class="tip" hidden></div></div>`;
}
function volumeChart() {
  const after = SESS.filter(s => !s.imported), W = 360, h = 110, pad = { l: 22, r: 8, t: 8, b: 20 }, max = 5;
  const bw = (W - pad.l - pad.r) / after.length;
  const Y = v => pad.t + (1 - v / max) * (h - pad.t - pad.b);
  return `<div class="chart" data-chart="volume"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Working sets per session">
    ${[0, 3].map(v => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pad.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--dim)" font-family="Barlow">${v}</text>`).join("")}
    ${after.map((s, i) => `<path d="M${pad.l + i * bw + 2},${Y(0)} V${Y(s.working) + 4} q0,-4 4,-4 h${bw - 12} q4,0 4,4 V${Y(0)} z" fill="var(--accent)"/>`).join("")}
    <text x="${pad.l}" y="${h - 4}" font-size="11" fill="var(--dim)" font-family="Barlow">1 Aug</text><text x="${W - pad.r}" y="${h - 4}" text-anchor="end" font-size="11" fill="var(--dim)" font-family="Barlow">30 Sep</text>
    </svg></div>`;
}
function bodyChart() {
  const W = 360, h = 160, pad = { l: 34, r: 8, t: 10, b: 22 }, xs = WEIGH.map(w => +w.date), x0 = xs[0], x1 = xs[xs.length - 1];
  const vs = WEIGH.map(w => w.kg), lo = Math.floor(Math.min(...vs)) - 1, hi = Math.ceil(Math.max(...vs)) + 1;
  const X = t => pad.l + (t - x0) / (x1 - x0) * (W - pad.l - pad.r), Y = v => pad.t + (1 - (v - lo) / (hi - lo)) * (h - pad.t - pad.b);
  const ticks = []; for (let v = lo; v <= hi; v += 2) ticks.push(v);
  return `<div class="chart" data-chart="weigh"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Bodyweight over time">
    ${ticks.map(v => `<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pad.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--dim)" font-family="Barlow">${v}</text>`).join("")}
    ${[1,3,5,7].map(m => `<text x="${X(+new Date(2026,m,1))}" y="${h-4}" text-anchor="middle" font-size="11" fill="var(--dim)" font-family="Barlow">${MON[m]}</text>`).join("")}
    <path d="${WEIGH.map((w, i) => `${i ? "L" : "M"}${X(+w.date).toFixed(1)},${Y(w.kg).toFixed(1)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(x1)}" cy="${Y(vs[vs.length-1])}" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/></svg><div class="tip" hidden></div></div>`;
}

// ---------------------------------------------------------------- render + input
function sheetBody(k) {
  if (k.startsWith("weigh:")) return weighSheet(k.slice(6));
  if (k === "plate") return plateSheet();
  if (k === "progress") return `<div class="grab"></div><h3>Bench press</h3>${heroNum()}${strengthChart()}<button class="btn ghost" data-back>Close</button>`;
  if (k === "undoimport") return `<div class="grab"></div><h3>Undo this import?</h3><div class="dim">Removes the ${S.imports[0]?.n} sessions it brought in. Nothing you logged here is touched.</div>
    <button class="btn primary" data-undoimport>Remove them</button><button class="btn ghost" data-back>Keep them</button>`;
  return "";
}
function render() {
  const p = pageE(), app = document.getElementById("app");
  const sc = app.querySelector(".scroll"), keep = sc && app.dataset.p === JSON.stringify(p) ? sc.scrollTop : 0;
  const hadQ = document.activeElement?.id === "q";
  const V = { more, bank, newex:newEx, weigh, plates, profile, excluded, settings, data, preview, exset:exSettings };
  app.innerHTML = p.p === "ex" ? exPage(p.id) : (V[p.p] || (() => bar(p.p) + `<div class="scroll"><div class="note">Prototype: a system file picker opens here.</div></div>`))();
  app.dataset.p = JSON.stringify(p);
  const sc2 = app.querySelector(".scroll"); if (sc2) sc2.scrollTop = keep;
  if (hadQ) { const q = document.getElementById("q"); q?.focus(); q?.setSelectionRange(q.value.length, q.value.length); }
  const t = topE();
  document.getElementById("layers").innerHTML = t.sheet ? `<div class="scrim" data-back></div><div class="sheet" role="dialog">${sheetBody(t.sheet)}</div>` : "";
  renderProto();
}
function renderProto() {
  const p = document.getElementById("proto"), th = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  p.className = "proto" + (S.minP ? " min" : "");
  p.innerHTML = `<button class="tog" data-pmin>${S.minP ? "◀ proto" : "▶ hide"}</button><span>More tab</span>` +
    Object.keys(MORE).map(k => `<button data-pmore="${k}" class="${S.more===k?"on":""}">${k} ${MORE[k]}</button>`).join("") +
    `<div class="hr"></div><span>History</span>` + Object.keys(HIST).map(k => `<button data-phist="${k}" class="${S.hist===k?"on":""}">${k} ${HIST[k]}</button>`).join("") +
    `<div class="hr"></div><button data-pjump>Open Bench press</button><div class="hr"></div>` + ["dark","light"].map(k => `<button data-ptheme="${k}" class="${th===k?"on":""}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("");
  try { localStorage.setItem("screens-proto", JSON.stringify({ more:S.more, hist:S.hist, theme:document.documentElement.dataset.theme })); } catch (e) {}
}
function reset(stack) { S.stack = stack; S.tab = "progress"; try { history.replaceState({ d:1 }, ""); for (let i = 2; i <= stack.length; i++) history.pushState({ d:i }, ""); } catch (e) {} render(); }

document.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-back]"); if (!t) return;
  const d = t.dataset;
  if (d.pmore) { S.more = d.pmore; return reset([{ p:"more" }]); }
  if (d.phist) { S.hist = d.phist; return reset([{ p:"more" }, { p:"bank" }, { p:"ex", id:"Bench press" }]); }
  if ("pjump" in d) return reset([{ p:"more" }, { p:"bank" }, { p:"ex", id:"Bench press" }]);
  if (d.ptheme) { document.documentElement.dataset.theme = d.ptheme; return renderProto(); }
  if ("pmin" in d) { S.minP = !S.minP; return renderProto(); }
  if (d.toastafter) { toast(d.toastafter); return back(); }
  if ("back" in d) return back();
  if (d.toast) return toast("Prototype: " + d.toast);
  if (d.undo === "allow") { S.excluded.push(S.lastAllowed); document.getElementById("toast").hidden = true; return render(); }
  if (d.go) { const [p, id] = d.go.split(/:(.+)/); if (p === "ex") S.tab = "progress"; return push({ p, id }); }
  if (d.sheet) { if (d.sheet.startsWith("weigh:")) S.draftKg = d.sheet === "weigh:new" ? lastWeigh().kg : WEIGH[+d.sheet.slice(6)].kg; return push({ sheet:d.sheet }); }
  if (d.tab) { S.tab = d.tab; return render(); }
  if (d.eqf) { S.eqf = d.eqf; return render(); }
  if ("pickone" in d) { t.parentElement.querySelectorAll(".opt").forEach(b => b.classList.toggle("on", b === t)); return; }
  if ("toggle" in d) { t.classList.toggle("on"); const o = t.querySelector(".opt"); if (o) { o.classList.toggle("on"); o.textContent = o.classList.contains("on") ? "Yes" : "No"; } return; }
  if (d.kg) { S.draftKg = Math.max(30, +(S.draftKg + +d.kg).toFixed(1)); return render(); }
  if (d.saveweigh) { if (d.saveweigh === "new") WEIGH.push({ date: new Date(2026, 8, 30), kg: S.draftKg }); else WEIGH[+d.saveweigh].kg = S.draftKg; toast("Saved"); return back(); }
  if (d.delweigh) { WEIGH.splice(+d.delweigh, 1); toast("Deleted"); return back(); }
  if (d.bar) { S.bar = +d.bar; return render(); }
  if (d.pl) { const [i, n] = d.pl.split(":").map(Number); S.plates[i][1] = Math.max(0, S.plates[i][1] + n); if (!S.plates[i][1]) S.plates.splice(i, 1); return render(); }
  if (d.dp) { S.draftPlate = +d.dp; return render(); }
  if ("addplate" in d) { const f = S.plates.find(p => p[0] === S.draftPlate); if (f) f[1] += 2; else { S.plates.push([S.draftPlate, 2]); S.plates.sort((a, b) => b[0] - a[0]); } return back(); }
  if (d.sex) { S.profile.sex = S.profile.sex === d.sex ? null : d.sex; return render(); }
  if (d.exp) { S.profile.exp = d.exp; return render(); }
  if (d.born) { S.profile.born = (S.profile.born ?? 1990) + (S.profile.born ? +d.born : 0); return render(); }
  if (d.ht) { S.profile.height = (S.profile.height ?? 178) + (S.profile.height ? +d.ht : 0); return render(); }
  if (d.allow) { S.lastAllowed = d.allow; S.excluded = S.excluded.filter(n => n !== d.allow); render(); return toast(`${d.allow} can be suggested again`, "allow"); }
  if (d.unit) { S.unit = d.unit; return render(); }
  if (d.th) { S.theme = d.th; if (d.th === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = d.th; return render(); }
  if ("undoimport" in d) { const n = S.imports.shift()?.n; toast(`Removed ${n} sessions`); return back(); }
  if ("doimport" in d) { S.imports.unshift({ on:"30 Sep", n:24 }); toast("Brought in 24 sessions"); return back(); }
  if (d.exu) { S.exSet.unit = d.exu; return render(); }
  if (d.reps) { S.exSet.repLo = d.reps === "auto" ? null : 6; return render(); }
  if (d.step) { S.exSet.step = d.step === "auto" ? null : +d.step; return render(); }
  if (d.never) { S.exSet.never = d.never === "1"; return render(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; render(); } });

// tap or drag on a chart for the nearest value
document.addEventListener("pointermove", chartTip); document.addEventListener("pointerdown", chartTip);
function chartTip(e) {
  document.querySelectorAll(".chart .tip").forEach(t => { if (!t.closest(".chart").contains(e.target)) t.hidden = true; });
  const c = e.target.closest?.(".chart"); if (!c) return; const tip = c.querySelector(".tip"); if (!tip) return;
  const r = c.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
  if (c.dataset.chart === "strength") { const i = Math.max(0, Math.min(SESS.length - 1, Math.round((fx * 360 - 34) / (360 - 42) * (SESS.length - 1)))), s = SESS[i];
    tip.innerHTML = `${fmtD(s.date)} · best ${Math.round(s.best)} · line ${Math.round(s.anchor)}`; }
  else if (c.dataset.chart === "weigh") { const i = Math.max(0, Math.min(WEIGH.length - 1, Math.round((fx * 360 - 34) / (360 - 42) * (WEIGH.length - 1)))); tip.innerHTML = `${fmtD(WEIGH[i].date)} · ${WEIGH[i].kg} kg`; }
  else return;
  tip.style.left = `${Math.max(15, Math.min(85, fx * 100))}%`; tip.hidden = false;
}
try { history.replaceState({ d:1 }, ""); } catch (e) { hist = false; }
render();
